const CHUNKS = {
u1:[
{id:"1.1",t:"What a contract is for",
 pts:["The contract is <span class='mark'>a means to an end</span> (Haggard). Goal: a document that satisfies the client's needs and a deal that goes through without hard feelings or litigation.",
 "Cohen (read in reverse): a good contract <b>clearly sets rights and duties, defines key terms, addresses all issues, has no ambiguity or inconsistency, uses plain English</b>.",
 "Payne's test: a third party who was not at the negotiation can understand the deal.",
 "Stark: a contract is the parties' <b>private law</b> and a <b>planning document</b> (looks forward, unlike litigation). Fox: same idea, plus <i>\"Ambiguity is the contract lawyer's enemy.\"</i> Bortolotti: the drafter acts as <i>legislator</i> of the parties.",
 "Why write it down (Doonan &amp; Foster): evidence, prevent fraud, set future rights, record existing rights, detail complex deals."],
 hook:"ICA s 2(h): contract = agreement enforceable by law. s 10: free consent, competent parties, lawful consideration and object, not declared void."},
{id:"1.2",t:"The good contract lawyer: Haggard's 9 steps",
 pts:["<span class='mark'>Drafting is thinking, not just writing.</span> Writing is step H, 'perhaps the easiest'.",
 "<b>A Ask why</b> (Director of R&amp;D example: a sudden request means something happened). <b>B Audience</b> (other party, protected class, bad-faith reader, old friend, wider audience, judge/arbitrator). <b>C Factual context</b> (Raffles v Wichelhaus, two ships Peerless). <b>D Content</b> (who/what/when/where/how/why + 'what if'). <b>E Check the law</b>. <b>F Conceptualise</b> (specific/general, precise/vague, concrete/abstract). <b>G Organise</b> (division, classification, sequence). <b>H Write</b>. <b>I Review</b> ('drafters quit too early'; proofread by someone else).",
 "Stark: skills = analytical, negotiating, business understanding, legal knowledge, eye for detail. The lawyer translates business terms into contract concepts, so is not 'a mere scrivener'.",
 "Fox issue-spotting: the $3m pipe-threader client who says 'don't spend long on this'. Resolve issues <i>before</i> signing. 'In contract drafting, plagiarism is a virtue' (use precedent).",
 "Doonan &amp; Foster: obey instructions; if you disagree, advise first, then draft as told and note the advice on file. Bortolotti: coordinate clauses in a coherent whole, not a 'pot pourri'."],
 hook:"Mnemonic for A–I: <b>A</b>sk · <b>A</b>udience · <b>C</b>ontext · <b>C</b>ontent · <b>C</b>heck law · <b>C</b>onceptualise · <b>O</b>rganise · <b>W</b>rite · <b>R</b>eview."},
{id:"1.3",t:"Anatomy of a contract",
 pts:["<b>A Introductory:</b> cover page, title, draft version, preamble, place/date of execution, parties, party numbering, recitals, effective date, nomenclature, numbering, definitions, capitalised terms, interpretation.",
 "<b>B Operative:</b> rights and obligations, conditions precedent, closing deliverables, post-closing, payments, lock-in, remedial actions, confidentiality, exclusivity, non-compete, non-solicit, damages, LDs, territory, costs, indemnity, LoL, R&amp;W, term, renewal, termination, effect of termination, survival, relationship of parties, force majeure.",
 "<b>C Boilerplate:</b> further assurance, no set-off, non-reliance, notice, publicity, severability, governing law/jurisdiction, dispute resolution, waiver, assignment, amendment, entire agreement.",
 "<b>D Signature, schedules, annexures:</b> signatory name, date and place, plus technical detail, price lists, specifications.",
 "<b>Stark's 11 parts:</b> preamble, recitals, words of agreement, definitions, action sections, other substantive provisions, endgame, general provisions, signature lines, schedules, exhibits.",
 "<b>Payne's 10 parts:</b> Title, Preamble, Background, Consideration, Definitions, Action sections, Other substantive, Endgame, Boilerplate, Signature lines.",
 "Placement debate: Haggard puts force majeure and LDs in housekeeping; the class chart puts them in operative. Adams would move definitions to the back."],
 hook:"Mnemonic: <b>I O B S</b> = Introduce, Operate, Boilerplate, Sign."},
{id:"1.4",t:"How to read a contract: Burnham's 5 passes",
 pts:["Reading a contract is <b>non-linear, imaginative, non-literal, transformative, iterative</b>. 'Talk back' to the text. Read before the fact (advice) or after the fact (dispute: start at the disputed term).",
 "<b>1 Orientation:</b> theme (title, caption, recitals, main exchange), structure (foundation vs cathedral; final vs stepping stone), larger background. Three P's: <b>Predict, Provide, Protect</b>.",
 "<b>2 Explication:</b> boilerplate (don't skip), rights and duties (shall/will/must/agrees to; every duty has a right), declarations, duration and renewal dates (tickler file), conditions (if/provided/subject to; who controls the event; IF-THEN graphic).",
 "<b>3 Implication:</b> default rules (omitted, restated or changed?), implied conditions (who performs first?), trade usage / course of dealing / course of performance.",
 "<b>4 Remediation:</b> is it breach or excused? Damages; is counter-performance still due (material breach)? Specific performance, LDs, limits on remedies.",
 "<b>5 Evaluation:</b> assemble concerns, completeness (blanks, incorporated documents, non-parties), language weaknesses (substitute each definition into the clause), get expertise."],
 hook:"Mnemonic: <b>O E I R E</b> = Orient, Explain, Imply, Remedy, Evaluate."},
{id:"1.5",t:"Finding the deal: transaction, structure, objective",
 pts:["Ask <b>who, what, when, where, how, why</b> (Haggard's Sally Seller / Bill Buyer). Stark adds <b>how much</b>. Then the 'relentless what ifs'.",
 "Know the limit: remote risks raise cost and can kill negotiation. Leave them to default rules.",
 "Audience types: oral deal to memorialise; general deal with details left; potential offeree (include 'barter material' but avoid unconscionability); protected class (no overreaching); bad-faith reader (draft tight); old friend (looser, but 'former friends' sue); wider audience; judge (hostile to harsh terms, so use conciliatory language).",
 "Deal structure in order: conditions precedent → closing/deliverables → post-closing and payment → ongoing obligations (lock-in, confidentiality, exclusivity, non-compete) → term and exit.",
 "A&amp;W basics: who are the parties, how/when each performs, payment, start/end, notices, law/jurisdiction. <b>Anyone with rights or obligations should be a party.</b>",
 "Doonan &amp; Foster: pick the right depth (landlord who finally found a tenant won't want scary rent-review detail)."],
 hook:"Exam move: start every problem answer with 'the client's commercial objective is…', then risks."},
{id:"1.6",t:"Allocating rights, obligations and risk: Stark's 7 concepts",
 pts:["<div class='table'><table><tr><th>Concept</th><th>What</th><th>Verb</th><th>Remedy</th></tr><tr><td>Representation</td><td>Past/present fact to induce</td><td>represents</td><td>Misrepresentation: rescission/damages</td></tr><tr><td>Warranty</td><td>Promise statement is true (indemnity)</td><td>warrants (will for future)</td><td>Damages, no reliance needed</td></tr><tr><td>Covenant</td><td>Promise to do / not do</td><td>shall / shall not</td><td>Damages, specific performance</td></tr><tr><td>Right</td><td>Entitlement; flip side of a covenant</td><td>is entitled to</td><td>Via other side's duty</td></tr><tr><td>Condition</td><td>Uncertain event before obligation</td><td>must / only if / if…then</td><td>No obligation; walk away</td></tr><tr><td>Discretionary authority</td><td>A choice</td><td>may</td><td>None; not exercising is no breach</td></tr><tr><td>Declaration</td><td>Agreed fact/definition/policy</td><td>means / present tense</td><td>None</td></tr></table></div>",
 "<b>Shall rules (Stark):</b> if no party precedes 'shall' it is wrong ('goods shall be delivered'); 'shall be' and 'shall have' are wrong; never in conditions. Use <b>will</b> for future events and future warranties.",
 "<b>Risk allocation by qualifying:</b> representations (knowledge, schedule exceptions), covenants (absolute → commercially reasonable efforts → capped → mere request), conditions (satisfactory vs reasonably satisfactory vs substantially in form), discretion (unfettered → consent not unreasonably withheld → exceptions).",
 "Fox 'softening the edges': materiality, reasonableness, 'to the best of knowledge', ordinary course, past practice. Efforts: Adams says best = reasonable efforts; English law says best endeavours is more onerous (IBM v Rockware; Rhodia v Huntsman; Jet2 v Blackpool).",
 "Haggard F: <b>precise</b> ('24 hours') vs <b>vague</b> ('reasonable time'): vagueness is a deliberate cushion, but not ambiguity. Do not use contract concepts as headings (Payne)."],
 hook:"Condition test: 'If the Buyer obtains a mortgage, the Buyer shall buy' (correct). Declaration test: would a party want damages if it were false? If yes, it isn't a declaration."},
{id:"1.7",t:"How clauses interact",
 pts:["Payne: parts 'well coordinated'; boilerplate must use <i>this</i> agreement's defined terms.",
 "Cohen #19: arbitration clause + exclusive court venue = confusion. #7 inconsistent terminology. #8 misleading headings (Haynes v Farmers). #9 unrelated items together.",
 "<b>Fox's trumping tools:</b> proviso ('provided, however'), <b>notwithstanding</b> (this clause wins), <b>except as otherwise provided</b> / <b>subject to</b> (this clause gives way), <b>without limiting the generality of the foregoing</b>, and inconsistency-between-agreements clauses (bind only parties to both).",
 "Stark: <b>contextual ambiguity</b> = two inconsistent provisions (Tenant maintains the Building vs Landlord maintains the lobby). 'Say the same thing the same way' (knowledge qualifiers 'officers' vs 'executive officers'). Keep general provisions identical across transaction documents.",
 "Recitals vs operative part: clear recital beats ambiguous operative; clear operative beats ambiguous recital; both clear but inconsistent → operative wins.",
 "Haggard division rules: categories mutually exclusive; parts sum to the whole; one principle. Classification: put it where readers look.",
 "Interaction table to remember: indemnity ↔ LoL cap; confidentiality ↔ survival and cap; exclusivity ↔ carve-outs; dispute resolution ↔ governing law; entire agreement ↔ MoU; force majeure ↔ SLA and termination."],
 hook:"Bortolotti severability example: a void export ban left the licensee with the licence and free to export. Standard clauses can defeat the bargain."},
{id:"1.8",t:"Drafting defects and interpretation",
 pts:["<b>Adams Ch 7 sources of uncertain meaning:</b> ambiguity (lexical, antecedent, contract-reference), insufficient specificity, mistake (Raffles), conflict, failure to address an issue (Sabatini 'private garage'), vagueness. Vagueness is a tool when used with restraint. Creative ambiguity is gamesmanship.",
 "<b>Stark's 3 ambiguities:</b> semantic (dollars?), syntactic (modifier scope; and/or), contextual (clause conflict). Don't use <b>and/or</b>. Tabulate to show grouping. Move qualifiers: 'pending or, to the Borrower's knowledge, threatened'.",
 "<b>Labels for defect answers:</b> semantic / syntactic ambiguity · vagueness · insufficient specificity · inconsistency · omission (gap) · agreement to agree · undefined term · wrong cross-reference · incorporation of changing document · passive voice · stuffed or circular definition · unadapted template.",
 "<b>Dates:</b> 'by', 'within 30 days of', 'between' are ambiguous. Say 'on or before', 'from and including'. Dodds v Walker: one month from 15 July ends 15 Aug; 30 days ends 14 Aug.",
 "<b>English interpretation (A&amp;W):</b> words → objective reading → context → clear language applies → exclude subjective intent and negotiations → business common sense only if ambiguous. Cases: ICS v West Bromwich, Chartbrook, Rainy Sky, Arnold v Britton, Wood v Capita.",
 "Wydick: cut surplus words, base verbs not nominalisations, active voice, short sentences, keep modifiers close, avoid lawyerisms and 'shotgunning'.",
 "Cases from Cohen: McKinnon v Baker (recitals), Tripp v Cotter (parol evidence/merger), Mattel v MGA ('includes'), D.R. Horton v Green (tiny font)."],
 hook:"Indian hooks: ICA s 29 (uncertain agreements void). Contra proferentem. Evidence Act ss 91–92 (now BSA ss 94–95) = parol evidence."}
],
u2:[
{id:"2.1",t:"Parties and capacity",
 pts:["Use the <b>full legal name</b> from organisational documents. Add jurisdiction/entity type as an appositive: <i>Internet Inc., a Delaware corporation,</i>. <b>Divisions are not legal entities</b>; name the company.",
 "Keep addresses out of the preamble (notice clause) (Stark). Payne is looser: if you give one address give both.",
 "Cohen #21: ABC, Inc. / ABC Transportation / ABC Credit. Never swap an entity and its owner.",
 "Defined terms for parties: <b>(the \"Executive\")</b> with 'the' inside brackets; never 'hereinafter'; one term per party; same kind of term for both (role terms or short names). Avoid lessor/lessee style look-alikes.",
 "Several parties: 'individually a Shareholder and collectively the Shareholders'. One entity in two roles: define each capacity.",
 "Capacity and authority: minors, mental capacity; check the signatory's authority. Signature block: company name, then 'By:' name and title. Notarisation is 'window dressing' unless a statute requires it."],
 hook:"Indian: ICA ss 11–12 (age of majority, sound mind). Minor's agreement void (Mohori Bibee v Dharmodas Ghose). Company signs via board resolution."},
{id:"2.2",t:"Title, preamble, recitals, words of agreement",
 pts:["<b>Title</b> describes the deal ('Horse Purchase Contract'), matches the preamble, centred, bold (Cohen #1; Stark; Payne).",
 "<b>Preamble</b> (Stark): 'This Supply Agreement, dated March 3, 20XX, is between X, an Indiana corporation (the \"Manufacturer\"), and Y…'. Define 'Agreement' to include schedules and amendments.",
 "<b>Dated vs dated as of;</b> record real signing date in an Effective Date clause. Never backdate to deceive. Effective Date can be event-based.",
 "<b>Haggard's 5 uses of recitals:</b> purpose (frustration) · shared facts (mistake) · damages background · why time is of the essence · soften harsh terms (unconscionability). Recitals are not promissory.",
 "<b>Stark adds:</b> inform third parties, support enforceability (non-compete), clarify intent (Wood v Lucy, Lady Duff-Gordon), explain consideration (guaranty). Her 12 guidelines in short: only if they add value, tell a story, accurate facts, <b>no operative terms</b>, don't incorporate them, usually no price, no WHEREAS/WITNESSETH, no 'desires' statements, define properly, don't use undefined terms.",
 "<b>Words of agreement:</b> 'Accordingly, the parties agree as follows:'. Reciting consideration cannot create it (gold watch example). State the real exchange (Cohen #6: price, quantity, quality, time of performance/payment)."],
 hook:"Indian: s 2(d) consideration may move from promisee or any other person. s 25: no consideration = void (exceptions: love and affection registered, past voluntary service, time-barred debt). Inadequacy doesn't void."},
{id:"2.3",t:"Definitions (Adams Ch 6)",
 pts:["Purpose: shorten, and <b>say the same thing the same way</b>. Jobs a definition can do: expand/limit, clarify, resolve ambiguity, explain technical terms, express deal concepts, list.",
 "<b>Strategic:</b> a closed-list 'Force Majeure Event' suits the performing party; criteria-based suits the non-performing party. Definitions set standards (who is an 'Affiliate'?).",
 "<b>Verbs:</b> <span class='mark'>means</span> = complete; <span class='mark'>includes</span> = enlarging (Mattel v MGA); 'does not include' = limiting. <b>Never</b> 'shall mean', 'means and includes', 'includes only', or a dash instead of a verb.",
 "<b>Circular:</b> Adams tolerates repeating the term if it adds info; Stark/Cohen/Payne say avoid. <b>True circularity</b> (A by B, B by A): anchor to an external fact. <b>Overlapping:</b> Licensor / Software / Licensor Software.",
 "<b>Stuffed:</b> shall/must/may inside a definition. 'A party may sue on a representation or covenant, but not on a definition.' Move the obligation to an operative clause.",
 "<b>Autonomous</b> (own sentence in a definitions section, alphabetical, no article) vs <b>integrated</b> (parenthetical in context, with 'the'; short definitions work best). Mid-sentence placement can change meaning ('all agreements, oral or written (\"Contracts\")…').",
 "<b>Placement:</b> front (Stark, Haggard, Cohen) vs pared-down at back with on-site definitions for unique terms (Adams) vs index of definitions. Don't define unused terms; define abbreviations; use conventional terms (Business Day, GAAP); no dictionary reliance.",
 "Payne: definitions not circular, no covenants, more than dictionary meaning, only needed terms."],
 hook:"Exam move: for a definitions review, mark each term KEEP / DELETE / MERGE / REDRAFT / MOVE with a one-line reason (necessity, overlap, circularity, stuffing, scope, part of speech, placement)."},
{id:"2.4",t:"Interpretation clauses",
 pts:["Sits after definitions. States reading rules. <b>Must not enlarge who the parties are</b> (ABC Agreement cl 3.1–3.2).",
 "Stark's typical rules: defined terms carry across deal documents; references to Sections/Schedules are to this Agreement; 'including' = 'without limitation'; 'Person' includes successors; statutes include amendments; 'dollars' = which currency; 'must' signals a condition.",
 "Cautions: Adams (part-of-speech rule 'unexpected consequences'); Stark ('or' is not always inclusive); Burnham (headings clause; but misleading headings still hurt); don't send readers to a dictionary.",
 "Indian practice add-ons (beyond readings): headings for convenience, gender, calendar day vs Business Day, recitals and schedules form part, time periods exclude first day."],
 hook:"If Adams' 'corresponding meaning' rule comes up: safer to state each defined form than rely on a general rule."},
{id:"2.5",t:"Operative clauses: performance and scope",
 pts:["<b>Action sections</b> (Stark Ch 8): subject-matter performance, payment, term, closing date and deliveries. Payne asks for the same four.",
 "Subject-matter provision starts 'Subject to the provisions of this Agreement, …'. Promises need not mirror (borrower repays, not 'promises to borrow'). Some are self-executing (guaranty, release, grant of security): present tense.",
 "Closing: fix date or tie to event; rolling closing needs a <b>drop-dead date</b>; list closing deliveries.",
 "A&amp;W: state who performs, when, how, standards, place, packaging, performance indicators. Conditions precedent: say what happens if unmet (does a contract exist? what survives?). Cohen #11: specify date, time, place.",
 "Organising other provisions: by concept in timeline order (R&amp;W → covenants → conditions) or by topic (Payne prefers), most important first.",
 "<b>Scope tools:</b> degree of obligation (Stark landlord-consent ladder), breadth of discretion, Haggard's conceptual choices, softeners (Fox), inferred obligations (Burnham's Musselshell County franchise), <b>name the actor</b> (active voice; 'premises shall be kept in good repair' by whom?).",
 "Shall vs must: Stark's system (shall covenant, may discretion, must condition, will future) vs Wydick's ('don't use shall'). Either is fine if consistent."],
 hook:"Indian defaults: s 37 perform promises; s 46 reasonable time; s 47 business hours; s 49 place; s 55 time of the essence (voidable) vs not (compensation only)."},
{id:"2.6",t:"Payment, invoicing, tax",
 pts:["Stark: 'drafting monetary payment provisions incorrectly is not a glitch and not generally forgiven.' <b>Stark's 10 guidelines:</b> follow the cash · who pays what to whom, when, why, how · state amount (and currency) · who pays, active voice · calculate before signing · due date · stub periods and timing · how paid (immediately available funds, where) · separate provision per payment type · test formulas.",
 "A&amp;W: fixed vs variable price; express formulas mathematically (Chartbrook); <b>VAT inclusive?</b>; frequency and method; late-payment interest; is time of payment of the essence?; currency and exchange risk; deductions, set-off, withholding; refundable/advance?; ancillary costs; supporting documents.",
 "Burnham: 'net 30 from delivery' creates implied conditions; whoever delivers first is a creditor and should protect itself (security, guarantee, progress payments).",
 "Payne endgame: 'what happens to the money if contract terminates early'. Clause library: payment obligations are carved out of the cap.",
 "<b>Class cases:</b> RetailCo (30 days from invoice vs 15 from delivery: one trigger); Singapore buyer (define Business Day by place); Arclight cl 14 (fees exclusive of taxes; invoice deemed accepted if not disputed in 7 Business Days)."],
 hook:"Indian practice: fees exclusive of GST on valid tax invoice; TDS and certificates; late interest; MSMED Act 45-day limit for micro/small suppliers; fix currency and bank charges. (Beyond readings.)"},
{id:"2.7",t:"Confidentiality",
 pts:["<b>Types:</b> mutual (default for JVs, M&amp;A, 2–3 yrs); one-way discloser-favourable; one-way recipient-favourable; multilateral.",
 "<b>Definition of CI:</b> broad catch-all (max protection, may be overbroad) vs marking requirement (clear but leaves unmarked info unprotected). Define 'cautiously and in detail'.",
 "<b>Five standard exclusions:</b> public through no fault · already known · independently developed · from a third party not bound · legally compelled (prompt notice, cooperate).",
 "<b>Obligations:</b> restrict disclosure <i>and use</i>; need-to-know recipients bound equivalently (recipient liable for them); security; return/destruction; ownership stays with discloser. Keep the deal terms confidential; control announcements.",
 "<b>Term:</b> disclosure period 1–3 yrs; survival 2–5 yrs; trade secrets as long as secret. Singhania: can't be indefinite. State survival expressly.",
 "<b>Remedies:</b> injunction ('damages inadequate'), damages, LDs (reasonable pre-estimate, s 74), indemnity, termination. Carve confidentiality out of the cap or use a super-cap."],
 hook:"Indian: Niranjan Shankar Golikari v Century Spinning (1967 SC): protect trade secrets, not general skill. Proving leakage is hard (Sandhya Organic). DPDP Act 2023 for personal data (beyond readings)."},
{id:"2.8",t:"Exclusivity and territory",
 pts:["Exclusivity = negative covenant by the grantor, paired with positive duties on grantee (efforts, minimums).",
 "Burnham's Musselshell County: 'exclusive right' implies grantee efforts and no distribution elsewhere, and grantor can't grant anyone else.",
 "Checklist: who and which products; <b>Territory</b> defined precisely (online sales, travelling use); <b>reserved customers</b> defined and put in as 'Subject to clause X' inside the clause; duration/lock-in; performance conditions (minimum purchases; Arclight cl 16 SLA release); breach consequences; commission on direct sales; grantee non-compete during term.",
 "Bortolotti: minimum turnover → terminate, cancel exclusivity or shrink Territory; not using the right isn't waiver. Biotronik v Conor: lost resale profits were direct, not consequential.",
 "A&amp;W: 'promote sales to best of its ability' can require investment."],
 hook:"Indian: Gujarat Bottling v Coca Cola (1995 SC): in-term negative covenants OK unless unconscionable. Post-term restraints void (s 27). Competition Act 2002 s 3(4) (beyond readings)."},
{id:"2.9",t:"Schedules, annexures, cross-references",
 pts:["<b>Schedules</b> = disclosure schedules (supplement R&amp;W or list exceptions; an unscheduled item is a misrepresentation). <b>Exhibits</b> = forms of documents or related agreements. Make attachments part of the contract via the definition of 'Agreement'.",
 "Don't create empty schedules. Number after the section that calls for it. Adams: don't put the definitions section in an attachment.",
 "<b>Order of precedence</b> clause when body and schedule conflict. One source of truth for specifications.",
 "<b>Incorporation by reference:</b> read as if written in; fixed ('as at signing') vs moving ('as amended from time to time'). Moving supplier policies = unilateral variation (Blue Orbit).",
 "<b>Cross-references:</b> cite section numbers, never 'above/below/hereunder' (Adams); update on every redraft; Payne: easy to follow, not too abundant; decimal numbering keyed to Article.",
 "Cohen #8, #10: accurate headings; number paragraphs and pages."],
 hook:"ABC Agreement traps: numbering 1(a), (b), (c), (e), (e), (g); ARTICLE vs SECTION."},
{id:"2.10",t:"Writing operative clauses well",
 pts:["State who, what, when, how. Active voice, present tense, singular, short sentences (subject-verb-object together).",
 "Cut legalese: doublets/triplets (indemnify and hold harmless), 'in the event that', Latin, 'said', 'same', 'such', and/or.",
 "Tabulate conditions and lists. Use provisos properly; ejusdem generis when listing.",
 "Business contracts are not consumer plain English, but borrow its clarity (Stark Ch 1). 'If a risk can be perceived, draft for it.'",
 "Integration: coherent whole (Bortolotti), well coordinated (Payne), same thing same way (Stark), trumping words (Fox).",
 "Final review (Haggard I; A&amp;W Ch 10): revisit planning, then substance, then style, then proofread; check unauthorised changes and commercial points."],
 hook:"Payne format: Roman-numeral Articles centred bold; decimals 3.01; bold headings; page numbers bottom centre; no signature on an otherwise blank page."}
],
u3:[
{id:"3.1",t:"Representations and warranties",
 pts:["Rep = fact at a moment in time; warranty = promise statement is true. <b>Misrepresentation is a tort</b> (rescission; fraud adds damages/punitive). <b>Warranty breach is contract</b> (benefit-of-bargain, no reliance: CBS v Ziff-Davis). Take both.",
 "Reps cannot be about the future; use a warranty with 'will' or a covenant.",
 "<b>Maker</b> drafts narrow and qualified (knowledge, materiality, schedule exceptions, caps, time limits). <b>Recipient</b> drafts broad. Stark's no-litigation ladder: flat → except Schedule → to Seller's knowledge → any officer's knowledge → named officers plus diligent inquiry.",
 "Fox: 'to the best of its knowledge' turns fact into awareness. A&amp;W: knowledge warranty may imply reasonable enquiry (Sindall); use disclosure letter, claim time limits, thresholds and caps.",
 "Categories: authority and capacity, no conflict, enforceability, compliance with laws, IP, solvency, service conformity (Arclight cl 17).",
 "Civil-law caution: 'representations' is common-law (Bortolotti)."],
 hook:"Indian: ICA s 17 fraud, s 18 misrepresentation, s 19 voidable (not if truth discoverable with ordinary diligence), s 73 damages. Sale of Goods Act ss 12–17 conditions vs warranties."},
{id:"3.2",t:"Breach, default, remedies",
 pts:["First ask: is it a breach or excused (force majeure, waiver, failed condition, trade usage)? Default ⊃ breach (insolvency, change of control, cross-default).",
 "Consequences: <b>damages</b> (expectation measure); is counter-performance still due? (material breach; make it express; 'time is of the essence' needs a stated consequence); specific performance (not personal services; unique goods).",
 "<b>Contractual remedies (Stark):</b> price adjustment, self-help, default interest, injunction, LDs, indemnity, set-off, cumulative vs exclusive.",
 "<b>Cure:</b> grace periods (e.g. 30 days non-payment, 90 days other); Default → Event of Default after notice and grace; 'has occurred and is continuing'. A&amp;W: any breach vs material breach; need positive step to terminate (Artpower).",
 "<b>Notices of breach:</b> Stark prefers 'Notice of Intent to Terminate'; state grounds and clause, money due, whether ends on receipt, survival.",
 "<b>LDs vs penalties:</b> genuine pre-estimate. UK: Cavendish v Makdessi / ParkingEye v Beavis ('legitimate interest' test). Civil law: penalties allowed but reducible. Do LDs cap liability? depends on governing law (Meccaniche Rossi)."],
 hook:"Indian: s 73 (natural, contemplated loss; no remote loss); <b>s 74</b> (reasonable compensation up to named sum, even without proof of loss: Kailash Nath v DDA; ONGC v Saw Pipes); s 75. Specific Relief Act (2018 amendment: specific performance now general rule; s 42 negative covenants)."},
{id:"3.3",t:"Indemnity",
 pts:["Shifts financial burden of specified losses (mostly <b>third-party claims</b>) to the indemnifier. LoL caps; indemnity creates affirmative payment/defence duties.",
 "<b>Elements:</b> trigger (R&amp;W breach, IP infringement, confidentiality breach, negligence, law violation) · scope of loss (incl. legal fees, settlements) · who is liable · <b>defend vs indemnify</b> (say both: common law doesn't include defence) · notice (prompt; late notice reduces only to extent of prejudice) · cooperation · <b>control of defence</b> (indemnifier controls; indemnitee consent to settlement admitting fault/money/obligations) · duration, cap, basket.",
 "Scope options: narrow (third-party only) → moderate → broad (first-party too) → IP-specific → mutual.",
 "<b>IP indemnity:</b> mitigate by (a) procure licence (b) modify (c) replace (d) terminate and refund. Exclusions: customer modifications, unapproved combinations, use outside documentation, continued use after fix.",
 "Cohen #27: 'indemnify and hold harmless' is a couplet. A&amp;W: indemnities and exemptions apportion risk: check insurable and priced."],
 hook:"Indian: ICA s 124 (save from loss), s 125 (rights of indemnity-holder: damages, costs, compromise sums). Can claim once liability is absolute (Gajanan Moreshwar)."},
{id:"3.4",t:"Limitation of liability",
 pts:["Allocates financial risk by capping and excluding. 'Among the most heavily negotiated terms.'",
 "<b>Direct</b> (natural result: usually capped) vs <b>indirect/consequential</b> (lost profit, data, reputation: usually excluded). 'Consequential' is ambiguous: Hadley v Baxendale; Biotronik v Conor ($100m resale profits were general damages). <b>Name excluded losses expressly.</b>",
 "<b>Caps:</b> total contract value · 12-month fees (SaaS) · multiple (2–3×) · fixed sum · insurance limits · tiered / super-cap.",
 "<b>Carve-outs:</b> IP indemnity · data breach · confidentiality breach · wilful misconduct/gross negligence · payment obligations · death/personal injury · fraud.",
 "Mutual caps with asymmetric carve-outs is the usual compromise.",
 "<b>Drafting the interaction:</b> say whether cap and exclusion apply to indemnities ('Notwithstanding clause 23…'). This was the Webhosting problem (A5 Q9)."],
 hook:"Indian: enforced between commercial parties; can't exclude fraud; unconscionable standard terms struck (Brojo Nath Ganguly); s 73 already excludes remote loss."},
{id:"3.5",t:"Term, renewal, termination, post-termination",
 pts:["<b>Term (Stark 8.4):</b> unambiguous begin/end; 'unless sooner terminated'. A&amp;W: separate signing, commencement, length, ending. Make fixed term 'subject to' early termination. Courts won't imply a right to end a fixed term (Jani-King v Pula).",
 "<b>Renewal:</b> auto vs option; who; length; notice deadline; <b>no 'price to be agreed'</b> (agreement to agree); use % or index. Arclight cl 2: 3 yrs then 1-yr auto-renewal, 90 days' notice.",
 "<b>Termination grounds:</b> expiry, convenience, insolvency, breach (material? cure?), change of control, long-stop force majeure (Arclight 60 days), failed CPs, SLA failures.",
 "<b>Stark's 3 endings:</b> neutral · friendly (restore status quo, tie loose ends) · unfriendly (default). <b>Six points:</b> events · consequences of notice · termination date · survival of common-law rights · survival of specific clauses · dispute resolution.",
 "<b>Post-termination:</b> survival list and durations; money (prepaid fees, accrued fees); return of property/data; transition and exit assistance (Arclight cl 11); location of endgame clauses.",
 "Dodds v Walker for computing notice periods."],
 hook:"Indian: s 39 (refusal to perform), s 64 (restore benefits on rescission), s 65 (restitution), s 75 (compensation)."},
{id:"3.6",t:"Non-compete and non-solicitation",
 pts:["Three restrictive covenants: <b>confidentiality, non-compete, non-solicit</b> (non-dealing goes further).",
 "<b>ICA s 27:</b> agreements restraining lawful trade/profession are void, except sale of goodwill (reasonable local limits).",
 "<span class='mark'>During</span> the term: generally valid unless unconscionable (Niranjan Shankar Golikari; Gujarat Bottling). <span class='mark'>After</span> the term: void, no reasonableness test (Superintendence Co v Krishan Murgai; Pepsi Foods v Bharat Coca-Cola; Percept D'Mark v Zaheer Khan).",
 "Protectable: trade secrets and business connections, not general skill. Non-solicit is more readily upheld where narrow.",
 "English comparison: restraint void unless reasonable (Nordenfelt; Herbert Morris v Saxelby; Esso v Harper's). Bhat's time-space-locality rule. Blue-pencil vs reformation (Stark 16.7).",
 "<b>Drafting in India:</b> state legitimate interest in recitals; restraint during the term; rely on confidentiality/IP/garden leave/notice; narrow non-solicit; define activity, territory, period; injunction under SRA s 42, not forcing personal service."],
 hook:"Exam move: always mention the Indian/common-law contrast and say what you would draft instead of a post-term non-compete."},
{id:"3.7",t:"Force majeure and hardship",
 pts:["Not an English-law concept: without a clause only frustration is left (A&amp;W). Civil law differs (impossibility). CISG art 79 / UNIDROIT 7.1.7: impediment beyond control, unforeseeable, unavoidable.",
 "<b>Three conditions (Bortolotti):</b> unforeseeable · beyond control · irresistible (impossible or not reasonably sustainable). Cases: ICC 9466 (foreseeable arrests), ICC 5195 (commercial practicability), Sun Oil (others overcame it).",
 "<b>Structure:</b> general definition → list of events → consequences. Don't copy list-only US clauses. ICC 2003 clause: prove (a) beyond reasonable control (b) not reasonably foreseeable (c) can't reasonably be avoided; sub-contractor tests; relief from notice.",
 "Add: notice, mitigation, 'to the extent of', are payments excused?, SLA suspension, long-stop termination (Arclight 60 days), tailor events (Burnham: add 'strike').",
 "<b>Hardship:</b> performance excessively onerous (not impossible). Default pacta sunt servanda; trend to renegotiation (BGB §313, French art 1195). UNIDROIT 6.2.2: request renegotiation; court may adapt or terminate. ICC Hardship Clause 2003: negotiate, then terminate (no judicial rewriting).",
 "Drafting hardship: trigger thresholds, renegotiation timetable, fallback, interim performance."],
 hook:"Indian: s 32 (force majeure clauses: Energy Watchdog v CERC); s 56 (Satyabrata Ghose: impracticable ≈ impossible). Cost increase alone isn't frustration. <b>No general hardship doctrine: must be drafted.</b>"},
{id:"3.8",t:"Governing law and jurisdiction",
 pts:["Cohen #20: silence → fight over lex loci contractus. Distinguish <b>applicable law</b> from <b>jurisdiction</b>.",
 "Bortolotti: keep it simple, 'This contract is governed by the laws of [country]'. Avoid limiting words ('with respect to interpretation'). Stark: 'arising under <i>and relating to</i> this Agreement, including torts'; pair with a forum clause in the same place; choose a developed law.",
 "Mandatory rules survive a choice of law (Ingmar for agents).",
 "Burnham: choice of law ≠ choice of forum; need both. Cohen #13: exclusive venue clause. Don't contradict arbitration (Cohen #19). Jury waiver is a US point.",
 "A&amp;W: law/jurisdiction affects insurance cost and enforceability."],
 hook:"Indian: can choose among courts that already have jurisdiction, not create it (ABC Laminart v AP Agencies). s 28 voids absolute bars on proceedings (arbitration saved). Two Indian parties choosing foreign law: check TDM Infrastructure."},
{id:"3.9",t:"Dispute resolution",
 pts:["Litigation vs ADR (arbitration, mediation, conciliation, negotiation). Arbitration: neutrality, confidentiality, New York Convention enforcement.",
 "<b>Cohen warnings:</b> #17 vague mediation (name mediator, place, hours, cost, start, consequence of refusal) · #18 deadlock-prone arbitrator scheme · #19 arbitration + court venue · #22 'AAA rules' pasted.",
 "<b>Bortolotti essentials:</b> clear intent to arbitrate · institution or appointment method · scope ('arising out of or in connection with'). <b>Errors:</b> pathological clauses, split tribunals, narrow scope, courts + arbitration, ambiguous institution. <b>Optional:</b> seat (its courts supervise), language, number of arbitrators, amicable steps (keep precise and time-limited).",
 "Multi-tier: negotiation → mediation → arbitration (Singhania). Arclight cl 6 is the model: authorised reps, 30 days, then arbitration under the 1996 Act, seat Bengaluru, English.",
 "Stark 15.7: litigation clause items vs arbitration clause items."],
 hook:"Indian: A&amp;C Act 1996 s 7, 8, 9, 11, 34. Venue may be read as seat (BGS SGS Soma v NHPC). Unilateral sole-arbitrator appointment invalid (Perkins Eastman). Commercial Courts Act s 12A pre-institution mediation."},
{id:"3.10",t:"Boilerplate in the risk and exit picture",
 pts:["<div class='table'><table><tr><th>Clause</th><th>Key point</th></tr><tr><td>Entire agreement</td><td>Excludes prior deals; to cover misrepresentation also say no reliance; fraud can't be excluded; carve out NDAs/MoUs. Cohen #15: 24 words beat 174.</td></tr><tr><td>Amendment</td><td>Signed writing only. Courts/CISG 29(2) can still allow conduct to override.</td></tr><tr><td>Waiver</td><td>Generic clauses weak in civil law; draft specific non-waiver.</td></tr><tr><td>Severability</td><td>Make survival depend on essential terms; replace with nearest valid clause; blue pencil vs reformation.</td></tr><tr><td>Assignment</td><td>Rights vs delegation; 'void' removes power; cover change of control, merger, operation of law; written consent (Cohen #23); novation for burdens.</td></tr><tr><td>Notices</td><td>Writing, methods, address, deemed receipt; strict compliance (Mannai v Eagle Star); Cohen #25.</td></tr><tr><td>Others</td><td>Counterparts; third-party rights; further assurance; no set-off; publicity; non-reliance.</td></tr></table></div>",
 "Stark: 'boilerplate' misleads; each raises real issues, so tailor, and keep identical across transaction documents."],
 hook:"Indian: scheme of amalgamation (Companies Act 2013 ss 230–232) can move contracts without consent; novation s 62."}
]};

const EX = {
"1.1":["Haggard: a house buyer wants a binding commitment so that title and possession pass later. The paper is only the route to that.","Fox: a client says he has agreed to buy a used Model 780 pipe threader from Sellco for $3 million and 'don't spend a lot of time on this'. A good lawyer still asks about serial number, repairs, delivery, risk, testing, payment and warranties.","Doonan &amp; Foster: a memorandum recording the gift of a valuable picture (recording rights already given)."],
"1.2":["Haggard Step A: a client suddenly wants a written contract with its Director of Research and Development. Something has happened. Find out what, or you draft an 'exemplary' contract that solves nothing.","Haggard Step C: two ships named Peerless sailing from Bombay (Raffles v Wichelhaus). A drafter who knew would name the ship.","Haggard Step D: does a house sale include the drapes, shades and window air-conditioners?","Doonan &amp; Foster: a landlord who finally found a tenant may not want detailed rent-review clauses that scare the tenant off."],
"1.3":["Haggard's model opening: 'Thompson Seedless Grape Co, Inc. (Seller) and Nubbin Sales, Inc. (Buyer) enter into this contract for the sale of grapes and mutually agree to the following terms…'.","Burnham: 'Residential Lease' tells you a lot, 'Agreement' tells you nothing. 'First Bank of New York (Lender) and John C. Smith (Borrower)' shows a loan; 'Owens Chemical (Company) and John Bartos (Contractor)' shows little.","Burnham: foundation contract (European/Japanese model, details left open) vs cathedral (US style, every contingency covered)."],
"1.4":["Burnham: 100,000 bushels of wheat means 100,000 bushels plus or minus 5% in the wheat trade (trade usage).","Burnham: a lease requiring oil changes at 'reasonable intervals'; the parties always changed it every 5,000 miles, which fixes the meaning (course of performance).","Burnham: an 'AS IS' clause changes the default by disclaiming the implied warranty of merchantability.","Burnham: if 'transfer' is defined to include 'pledge', a clause banning transfer of shares also bans pledging them (substitution test).","Burnham: a contractor whose price includes $20,000 profit recovers that $20,000 if the owner breaches."],
"1.5":["Haggard: Sally Seller sells Bill Buyer a first edition book for $500. Who: the two (plus any arbitrator). What: the book. When: next Tuesday. Where: the Student Lounge, third floor. How: sealed sleeve, certified check. Why: stated in the preamble it can prove damages or justify specific performance.","A&amp;W: if the operating company is a shell, make the parent a party or get a guarantee, so you have someone worth suing.","Fox: the same pipe-threader questions as a who/what/when/where/how list."],
"1.6":["Stark: Sally sells her house to Bob for $200,000. Reps: built in 1953, roof four years old, propane tank exactly half full, walls eggshell white. If she repaints blue after signing, that is a covenant problem, not a misrepresentation.","Stark landlord-consent ladder: 'shall obtain the consent' → 'shall use commercially reasonable efforts' → deemed satisfied if she offers the landlord at least $10,000 → only 'request' consent.","Stark conditions: 'If the Buyer obtains a mortgage, the Buyer shall purchase the House' (correct). Late-notice example: insurance policy requires notice within ten days; as a covenant the insurer still pays, as a condition Bob forfeits.","Stark discretion: 'shall not assign without the Seller's consent' → 'which consent the Seller shall not unreasonably withhold' → 'except to his wife, Lara Raskin'.","Stark declarations: ''Purchase Price' means $200,000' does nothing until a covenant says 'The Buyer shall pay the Seller the Purchase Price'.","Haggard deck exercise: 'Pressure treated 2 x 6 pine planks' is the right level; stain 'compatible with the natural cedar house' is abstract, so name the product and colour."],
"1.7":["Cohen #19: one paragraph requires binding arbitration in Boulder; the next gives exclusive venue to the District Court of Boulder County. Must they arbitrate or may they sue?","Stark: 'The Tenant shall maintain the entire Building' vs 'The Landlord shall maintain the lobby'. Who maintains the lobby?","Fox: 'Notwithstanding anything in this Section 5 (Covenants) to the contrary, Target shall be permitted to enter into the Portuguese Joint Venture.'","Fox: covenant to insure at industry levels, then $5 million on the Deerfield plant; add 'Without limiting the generality of the foregoing' so $5 million is not treated as the cap.","Haggard: dividing the law school into 'first year law students' and 'female law students' breaks all three division rules.","Stark: 'to the knowledge of each of the Seller's officers' in three reps but 'executive officers' in the fourth; the client lost its claim."],
"1.8":["Cohen: a 'ton' could be 2,000 or 2,200 pounds.","Adams: 'all agreements, oral or written (Contracts), to which Dynaco is a party' accidentally defines Contracts as every agreement in the world.","Adams, Sabatini v Roybal: a covenant allowed a 'private garage' with no size limit; a 100 by 50 foot garage complied (failure to address an issue).","Adams, Richey v Metaxpert: a promise not to compete 'in the computer gaming business'; did it cover smartphone games?","Stark: 'president and/or general manager' has at least three mutually exclusive meanings. A Canadian maker and US retailer agree on '$10,000': which dollars?","Doonan &amp; Foster: a will leaving 'all my money' (Perrin v Morgan). 'Persons divorced on 1 July 1993' could mean that day or on or before it."],
"2.1":["Stark: Delaware holding company ABC Inc. has 49 subsidiaries also called ABC Inc. in different states; the state of incorporation tells them apart.","Stark: Bushwick Electric Co. has divisions Bushwick Appliances and Bushwick Engines; neither is a legal entity, so name the company.","Cohen #21: ABC, Inc. owns ABC Transportation, Inc. and ABC Credit, Inc.; or 'Acme, LLC' in one place and its owner 'Johnson' in another.","Stark's form: Internet Inc., a Delaware corporation, (the 'Company')."],
"2.2":["Cohen #1: 'Horse Purchase Contract' instead of 'Agreement'. Cohen #2: 'This is an Agreement between John Jones and Suzy Smith for the purchase of Jones's 50% interest in the horse known as Silver.'","Stark: 'This Supply Agreement, dated March 3, 20XX, is between Carpetmakers, Inc., an Indiana corporation (the Manufacturer), and Big Retail Corp., a Florida corporation (the Retailer).'","Stark 'as of': an executive starts work May 23, signs July 1; date the contract as of May 23, and record the real signing date in an Effective Date clause.","Stark/Farnsworth: an employer cannot make a promise of a gold watch enforceable by reciting 'in consideration of your past service'.","Stark: Wood v Lucy, Lady Duff-Gordon, where the recitals helped imply a duty of reasonable efforts."],
"2.3":["Stark: a lease describes 'the 2,500 square feet of storage space shown on Exhibit A' differently in several clauses; define 'Storage Space' once.","Stark: is the brother of a subsidiary's president an 'Affiliate'? The definition decides.","Adams circularity: Bonus Date and Bonus Period each defined by the other; Licensed Products and Licensed Patents likewise.","Stark: ''Song' means any song the Beatles recorded' (narrowing); ''Telephone' excludes a cellular telephone that does not take photographs'; 'E-book' rather than 'Book' signals a changed meaning.","Adams, Mattel v MGA (Bratz): did 'inventions', defined with 'includes, but is not limited to', cover mere ideas?","Stark: 'Intellectual Property… all of which are to be unencumbered as of the Closing Date' is a stuffed definition (condition or covenant?)."],
"2.4":["ABC Agreement cl 3.1–3.2: 'Company' redefined to include the ABC group and 'Buyer' to include 'associated' companies, silently enlarging who is bound.","Stark: statutes referenced 'as amended from time to time' vs 'as amended to the date of this Agreement' (CERCLA example)."],
"2.5":["Stark: 'Subject to the provisions of this Agreement, the Company shall hire the Executive, and the Executive shall work for the Company for the Term.' Also: author writes the book, publisher publishes it.","Stark: a loan; the bank promises to lend, the borrower does not promise to borrow but must repay. Self-executing: 'By signing this Security Agreement, the Borrower grants the Lender a security interest in the Borrower's assets.'","Cohen #11 (good version): 'Jones will deliver the horse to Smith at 574 Ridge Road, Durango, Colorado, by 5:00 p.m. on August 1, 2015, at Jones's expense.'","Burnham: 'The premises shall be kept in good repair'. By the landlord or the tenant? Name the actor."],
"2.6":["Stark: funds immediately available in Chicago are not immediately available in Tokyo; do not say 'cash' (courts read it as currency).","Stark: salary and a bonus need separate provisions; otherwise, is a bonus payable if the executive is terminated for cause?","A&amp;W: if the supply is taxable and the contract is silent, the price may be taken to include VAT; UK late-payment interest is 8% over base plus a fixed sum.","Class: RetailCo (30 days from invoice vs 15 from delivery, paid on day 20); Singapore buyer (Business Day when a holiday in India but not Singapore)."],
"2.7":["A&amp;W model: 'Each Party shall keep confidential (a) the terms of this agreement; and (b) any confidential information it acquires about the business of the other Party…, for [5] years after termination.'","Clause library: marking requirement, 'marked Confidential or, if oral, identified and confirmed in writing within 30 days'.","Stark: injunction wording, 'monetary damages will be inadequate… entitled to injunctive relief in addition to any other remedies'.","Cases: Niranjan Shankar Golikari v Century Spinning; Shree Gopal Paper Mills (no injunction where no secrets shown)."],
"2.8":["Burnham: 'Franchisee shall have the exclusive right to distribute Franchisor's products in Musselshell County' implies duties both ways.","Bortolotti, Biotronik v Conor: an exclusive distributor's lost resale profits were direct damages, so not excluded by a consequential-loss clause.","Arclight cl 16: lock-in ends if Nexora fails service levels and does not cure.","A&amp;W: a distributor to 'promote sales to the best of its ability' may have to invest."],
"2.9":["Stark: 'Schedule 3.10 lists all material contracts' (supplementing) and 'Except as stated in Schedule 3.18' (exception). An unscheduled item is a misrepresentation.","Stark: 'substantially in the form of Exhibit F' sets an objective standard.","Blue Orbit: services under 'the Supplier's standard policies, as amended from time to time' lets one side rewrite the terms.","ABC Agreement: definitions numbered 1(a), (b), (c), (e), (e), (g)."],
"2.10":["Cohen #27: a 47-word sentence that can be said in 21; a 20-word passive termination clause becomes 15 words active ('Either party may terminate this contract…').","Couplets and triplets: 'due and payable', 'indemnify and hold harmless', 'rest, residue, and remainder'; 'in the event that' for 'if'.","Cohen conclusion: 'Sell, convey, assign, transfer, and deliver' becomes 'sell'."],
"3.1":["CBS Inc. v Ziff-Davis: breach of warranty gives benefit-of-the-bargain damages without proof of reliance.","Stark no-litigation ladder: flat statement → 'Except as stated in Schedule 3.14' → 'to the Seller's knowledge' → knowledge of any officer → knowledge of three named officers plus what diligent investigation would reveal.","Stark future warranty: 'The machine will operate in accordance with the Specifications for 12 months.'","A&amp;W, Sindall v Cambridgeshire: 'to the best of its knowledge' implies reasonable enquiries."],
"3.2":["Burnham: liquidated damages wording, '$500 [per day], as liquidated damages and not as a penalty'. 'If Seller delivers after July 17, Buyer does not have to accept the goods' beats a bare 'time is of the essence'.","Stark: price adjustment of 0.5% per week of delay capped at 5% after a 4-week grace period; a play reopening at $10,000 per week; a contractor paying $1,000 per day rising to $2,000.","Stark: owner performs the contractor's work after 5 days' notice and deducts the cost (self-help).","Bortolotti, Meccaniche Rossi v Otto Müller: under German law the buyer could claim more than the 3.6% LD figure."],

const QS = [
{k:"short",t:"List Stark's seven contract concepts with the verb that signals each and the remedy for breach.",a:"Use the 1.6 table: representation (represents) → misrepresentation; warranty (warrants/will) → damages; covenant (shall) → damages/specific performance; right (is entitled to); condition (must/only if) → no obligation; discretionary authority (may) → none; declaration (means/present tense) → none. Add one sentence: the drafter's skill is translating business terms into these."},
{k:"short",t:"Distinguish ambiguity from vagueness with a contract example.",a:"Ambiguity = two or more distinct meanings (semantic: 'ton' short vs long; syntactic: modifier scope; Raffles ships). Vagueness = one meaning with fuzzy edges ('reasonable time'). Haggard: vagueness is a deliberate cushion but risky with a bad-faith reader. Fix: define, tabulate, or add objective benchmark."},
{k:"short",t:"Why shouldn't operative terms be placed in recitals?",a:"Recitals are not promissory (Haggard) and may not be enforced (Stark; McKinnon v Baker). Stark: operative provisions in recitals 'probably will not be enforceable'. Put covenants/R&amp;W/conditions after the words of agreement. Payne: Background has no covenants."},
{k:"short",t:"What is a stuffed definition? Give an example and a fix.",a:"A definition carrying an obligation (e.g. 'Services… which PPPL shall provide in accordance with the Service Levels'). Adams 6.52–6.58; Stark guidelines 18, 20. Fix: define neutrally, put the obligation in an operative clause. 'You can sue on a covenant, not on a definition.'"},
{k:"short",t:"Explain how 'subject to' and 'notwithstanding' resolve clause conflict.",a:"Fox 5:3. Subject to X: this clause yields. Notwithstanding X: this clause prevails. Use inside exclusivity vs direct-sales carve-out (A4 Q8). Add an order-of-precedence clause for body vs schedules."},
{k:"short",t:"Why is post-employment non-compete void in India?",a:"ICA s 27 (void restraints; goodwill exception). Indian courts ask only whether there is a restraint, not reasonableness (Krishan Murgai; Pepsi Foods). In-term restraints are valid unless unconscionable (Niranjan Shankar; Gujarat Bottling). Use confidentiality, IP assignment, notice/garden leave, narrow non-solicit."},
{k:"short",t:"What should a force majeure clause contain?",a:"General definition + list of events + consequences. Three conditions (unforeseeable, beyond control, unavoidable). Notice, mitigation, 'to the extent of', payment obligations, SLA suspension, long-stop termination (Arclight 60 days). Indian s 32/56 context."},
{k:"long",t:"Using Haggard's process, explain what a good contract lawyer does before writing and why drafting is more than writing. Illustrate with a 3-year supply agreement.",a:"Skeleton (≈25 min): Intro: contract = means to an end; drafting is intellectual. Body: A Ask why (client's objective; Director of R&amp;D example) → B Audience (counterparty posture, bad-faith reader, judge) → C Context (Raffles) → D Content (who/what/when/where/how/why; what ifs: cost rises, demand shifts, supply disruption; remote risks left to defaults) → E Law (ICA s 10, s 29) → F Conceptualise (precise 'within 24 hours' vs vague; specific vs general) → G Organise (division, classification, sequence) → H Write → I Review (proofread by someone else). Link: Stark's concepts translate business terms; Burnham's Predict/Provide/Protect. Conclude: writing is 'perhaps the easiest' step."},
{k:"long",t:"Read-and-analyse: apply Burnham's five passes to a services agreement.",a:"Skeleton: define reading as non-linear etc. Then 5 headings. Orientation (title, caption, recitals, exchange; foundation vs cathedral). Explication (boilerplate; rights/duties table; conditions; renewal dates). Implication (defaults, who performs first, usage). Remediation (breach vs excuse, damages, LDs s 74, termination). Evaluation (gaps, blanks, definitions substitution, passive voice, plain English, negotiables). Give 2–3 concrete observations each and end with advice to client."},
{k:"long",t:"Critically discuss the allocation of risk between indemnity and limitation of liability clauses, and redraft the interaction.",a:"Skeleton: define each (indemnity = affirmative duty for third-party claims; LoL = cap/exclusion). Show collision (A5 Q9: cl 23 vs cl 32; two readings). Library: carve-outs (IP, data, confidentiality, wilful misconduct, payment, death). Cap structures; super-cap. Direct vs consequential (Biotronik). Indian s 73/124/125; Brojo Nath. Redraft: 'Except for liability under clause 32 and for breach of clause [x], neither party is liable for indirect… loss' plus defined 'Losses'. Advice: who bears which risk, insurance alignment."},
{k:"long",t:"Review the definitions section of a licence agreement (e.g. PPPL–RRRL).",a:"Skeleton: method (necessity, overlap, circularity, stuffing, scope, part of speech, placement). Table with KEEP/DELETE/MERGE/REDRAFT/MOVE. Cover: Software/Licensed Software/Software Platform (merge); Authorised User/User/Permitted User (overlap, circular); Services and Service Levels (stuffed); Support/Support Request (circular); Control (noun vs verb); Business Day (place); Improvements (overlap with Software); Licensed Affiliates (new). Cite Adams Ch 6 and Payne. Missing terms: Usage Data, Effective Date, Term."},
{k:"long",t:"Spot and fix drafting defects in a given clause (A4/A5 style).",a:"Four-step method per clause: (1) name the defect with the textbook label; (2) quote the words and give both readings applied to the facts (do the date/arithmetic); (3) cite authority (Adams, Stark, Cohen, Burnham, A&amp;W, ICA); (4) fix: the question to ask the client plus a redraft. Reuse the ten one-line fixes in the Cram sheet."},
{k:"long",t:"Discuss restraint of trade and confidentiality in employment/commercial contracts in India.",a:"Skeleton: three covenant types (Bhat). s 27 and goodwill exception. In-term vs post-term table with cases. Protectable interests (trade secrets, not skill). Non-solicit vs non-dealing. Compare English reasonableness (Nordenfelt, Herbert Morris, Esso). Drafting advice: legitimate interest recital, in-term restraint, confidentiality/IP/garden leave, severability, remedy via SRA s 42 but no forced service. Mention DPDP and trade-secret proof problems."}
