{u:"u1",t:"Burnham's five passes for reading a contract",
 q5:"List Burnham's five passes. (5)",
 five:["<b>Orientation:</b> theme, structure, larger background (Predict, Provide, Protect).","<b>Explication:</b> boilerplate, rights and duties, declarations, duration, conditions.","<b>Implication:</b> default rules, implied conditions, trade usage, course of dealing.","<b>Remediation:</b> breach or excuse, damages, material breach, specific performance, LDs.","<b>Evaluation:</b> concerns, completeness, language weaknesses, expert input."],
 q10:"Apply Burnham's five passes to a services agreement you are asked to review. (10)",
 ten:[["Intro","Reading a contract is non-linear, imaginative, non-literal, transformative and iterative; read before the fact (advice) or after (dispute)."],["1 Orientation","Title and caption (Lender/Borrower tells you more than Company/Contractor), recitals, main exchange. Foundation (details left open) or cathedral (everything covered)? Final agreement or stepping stone such as an MoU?"],["2 Explication","Do not skip boilerplate. List duties by their words (shall, will, must) and the matching rights; look for inferred duties (Musselshell County franchise). Diarise start, end and renewal-notice dates. Conditions: who controls the event?"],["3 Implication","What would law supply if silent? Does an 'AS IS' clause change the default? Who performs first and so becomes a creditor? Trade usage (100,000 bushels ±5%) and course of performance (oil change every 5,000 miles)."],["4 Remediation","Is non-performance excused (force majeure, waiver, failed condition)? Expectation damages ($20,000 profit). Is the other side's performance still due? Make materiality express; 'time is of the essence' needs a stated consequence."],["5 Evaluation","Blanks, incorporated documents, obligations placed on non-parties; plain English; substitute each definition into the clause ('transfer' including 'pledge'); compare a current form."],["Conclusion","End with a list of issues to raise and the changes you would propose."]]},
{u:"u1",t:"Stark's seven building blocks and risk allocation",
 q5:"Explain representations, warranties, covenants and conditions with the verb and remedy for each. (5)",
 five:["<b>Representation:</b> statement of past or present fact to induce a party to act; signalled by 'represents'; remedy misrepresentation (rescission; fraud adds damages).","<b>Warranty:</b> promise that the statement is true (an indemnity); 'warrants', or 'will' for the future; damages without proof of reliance (CBS v Ziff-Davis).","<b>Covenant:</b> promise to do or not do; 'shall'; damages or specific performance.","<b>Condition:</b> uncertain event that must occur before an obligation; 'must' / 'only if' / 'if…then'; failure means no duty to perform.","Remaining three: right ('is entitled to'), discretionary authority ('may'), declaration ('means', present tense)."],
 q10:"Using Stark, explain how the choice and wording of contract concepts allocates risk. (10)",
 ten:[["Intro","The drafter translates business terms into seven concepts; the concept chosen and how it is qualified decide who bears the risk."],["Reps and warranties","Truth is tested at one moment: repainting walls after signing is a covenant issue, not a misrep (Sally/Bob). Qualifiers move risk: flat → 'except Schedule 3.14' → 'to the Seller's knowledge' → named officers. The recipient wants both a rep (rescission) and a warranty (damages without reliance)."],["Covenants","Degree of obligation: 'shall obtain consent' (seller bears risk) → 'commercially reasonable efforts' → deemed met if $10,000 offered → only 'request'."],["Conditions","Including a condition puts risk on the party entitled to performance (mortgage condition). Condition vs covenant: late insurance notice is forfeiture as a condition, damages only as a covenant. Standard: 'satisfactory' vs 'reasonably satisfactory' vs 'substantially in form of Exhibit B'."],["Discretion and declarations","Assignment: unfettered consent → 'not unreasonably withheld' → carve-out for wife Lara Raskin. A declaration cannot be breached; ''Purchase Price' means $200,000' needs a covenant to pay."],["Drafting rules","Use 'shall' only after a named party; 'will' for the future; 'must' for conditions. Do not use concepts as headings (Payne)."],["Conclusion","Always ask whose side you act for and where the risk lands."]]},
{u:"u1",t:"Ambiguity, vagueness and drafting defects",
 q5:"Distinguish ambiguity from vagueness and name three drafting defects. (5)",
 five:["<b>Ambiguity:</b> two or more distinct meanings (semantic: 'ton'; syntactic: modifier scope).","<b>Vagueness:</b> one meaning with fuzzy edges ('reasonable'); can be a deliberate cushion (Haggard).","<b>Conflict:</b> two clauses answer the same question differently (Cohen #19).","<b>Failure to address an issue:</b> Sabatini, 'private garage' with no size limit.","<b>Agreement to agree:</b> price 'by mutual agreement' with no fallback; ICA s 29."],
 q10:"Identify and classify the sources of uncertain meaning in contracts and explain how a drafter removes each. (10)",
 ten:[["Intro","Adams Ch 7: six sources; courts lump them as 'ambiguity' but they work differently."],["Ambiguity","Lexical (homonymy/polysemy: 'foreclosure'), antecedent (Loso: 'said cost'), contract-reference ('hereunder'). Fix: define, restate, cite section numbers."],["Syntactic (Stark)","'pending or threatened to the Borrower's knowledge'; 'and/or' (president and/or general manager). Fix: move qualifier, tabulate, drop and/or."],["Insufficient specificity / mistake","Richey ('computer gaming business' vs smartphones); Raffles (two Peerless ships). Fix: name the thing precisely and know the facts."],["Conflict / omission","Tenant vs Landlord maintains lobby; Sabatini. Fix: 'subject to' / 'notwithstanding', precedence clause; ask 'what if' (Haggard)."],["Vagueness","Use only where little is at stake; narrow it; or add benchmark. Creative ambiguity is gamesmanship (United Rentals)."],["Dates","'By', 'within 30 days of' are ambiguous; Dodds v Walker (1 month vs 30 days)."],["Indian hook / conclusion","ICA s 29 voids uncertain agreements; contra proferentem. Remove ambiguity because the drafter bears the risk."]]},
{u:"u1",t:"How clauses interact (Fox trumping, consistency)",
 q5:"Explain 'subject to' and 'notwithstanding' with an example. (5)",
 five:["Contracts contain clauses that can conflict; the careful drafter says which wins (Fox 5:3).","'<b>Subject to clause X</b>': this clause yields to X.","'<b>Notwithstanding clause X</b>': this clause overrides X.","Example: PharmaCo exclusivity: 'Subject to clause 7.2, PharmaCo appoints… exclusive'; 'Notwithstanding clause 3.1, PharmaCo may sell directly to Institutional Customers.'","Add an order-of-precedence clause for body vs schedules."],
 q10:"Discuss how drafters ensure the clauses of a contract work together. (10)",
 ten:[["Intro","Many disputes come from two sensible clauses pulling apart (Payne: parts 'well coordinated')."],["Consistency of language","One term for one thing (Cohen #7); say the same thing the same way (Stark: 'officers' vs 'executive officers')."],["Trumping tools (Fox)","Proviso; 'notwithstanding'; 'except as otherwise provided'; 'without limiting the generality of the foregoing' (Deerfield plant $5m insurance); inconsistency-between-agreements clause (binds only parties to both)."],["Recitals vs operative","Clear recital beats ambiguous operative; clear operative beats ambiguous recital; both clear → operative."],["Organisation","Haggard: categories mutually exclusive, sum to the whole, one principle; classify where readers look."],["Key interactions","Indemnity ↔ cap; confidentiality ↔ survival; exclusivity ↔ carve-outs; arbitration ↔ court venue (Cohen #19); fixed term ↔ early termination ('subject to')."],["Conclusion","Do a final coherence review; Bortolotti: avoid a 'pot pourri' of clauses."]]},
{u:"u1",t:"Plain English and Cohen's list",
 q5:"Why does Cohen satirise bad contracts and what are three of his points? (5)",
 five:["Satire: bad contracts keep litigation profitable; read each point in reverse.","#1 generic title → use a descriptive title ('Horse Purchase Contract').","#19 inconsistent provisions (arbitration + exclusive court venue).","#5 undefined or circular definitions; #15 no merger clause.","#27 legalese: long sentences, passive voice, doublets, Latin."],
 q10:"Using Cohen, Wydick and Payne, explain plain-English drafting in contracts. (10)",
 ten:[["Intro","Plain English reduces misunderstanding; business contracts are not consumer documents but borrow its clarity (Stark)."],["Cohen's rules","Short intro, no WHEREAS/WITNESSETH, accurate headings, number paragraphs, one topic per paragraph, state date/time/place, 24-word merger clause, readable font."],["Wydick","Cut surplus words; base verbs not nominalisations; active voice (passive hides the actor); short sentences; keep subject-verb-object together; avoid lawyerisms and 'shotgunning'."],["Payne's error list","Archaic language, legalese, wordiness, passive, double negatives, dangling modifiers, dual verbs, boilerplate not conformed to terms."],["Example","47-word sentence cut to 21; 'indemnify and hold harmless' is a couplet; 'Sell, convey, assign, transfer and deliver' becomes 'sell'."],["Conclusion","Clear writing is risk management, not decoration."]]},

{u:"u2",t:"Parties, preamble and recitals",
 q5:"What should a preamble and recitals contain and avoid? (5)",
 five:["Preamble: name of agreement, date, parties with full legal name and entity type (Stark): 'Internet Inc., a Delaware corporation'.","Define parties parallel: (the \"Manufacturer\") / (the \"Retailer\"); never 'hereinafter'.","Never name a division; Cohen #21: ABC, Inc. vs its subsidiaries.","Recitals: purpose, shared facts, background for damages, why time is of the essence, soften harsh terms (Haggard).","Avoid operative terms, WHEREAS, price, and undefined terms in recitals (Stark's guidelines)."],
 q10:"Discuss the function and legal effect of recitals. How should they be drafted? (10)",
 ten:[["Intro","Recitals explain the 'why' of the deal; they are not promissory."],["Uses","Haggard's five: frustration, mistake, damages, time of the essence, unconscionability. Stark adds: inform third parties, support enforceability (non-compete), clarify intent (Wood v Lucy), explain consideration (guaranty)."],["Legal effect","Haggard: part of the contract but create no duties; facts may be conclusive. Stark: not part of the binding terms; operative provisions in recitals 'probably will not be enforceable' (McKinnon v Baker)."],["Conflict rules","Clear recital + ambiguous operative → recital; clear operative + ambiguous recital → operative; both clear → operative."],["Drafting rules (Stark)","Only if useful; tell a story; accurate facts; chronology; no operative terms; do not incorporate; generally no price; plain headings; no 'desires' statements."],["Words of agreement","'Accordingly, the parties agree as follows:'. Reciting consideration cannot create it (gold watch)."],["Indian hook","ICA s 2(d), s 25: state the real exchange in the operative clauses."],["Conclusion","Short Background, facts only, nothing a party must do."]]},
{u:"u2",t:"Definitions and interpretation",
 q5:"State five rules for drafting good definitions. (5)",
 five:["Define only terms that need it; use them consistently with initial capitals.","Use <b>means</b> for complete, <b>includes</b> for enlarging; never 'shall mean' or 'means and includes'.","No circular or overlapping definitions (Adams); anchor to an external fact.","No obligations in definitions ('stuffed': shall, must, may).","Choose placement: front, back with on-site definitions, or index."],
 q10:"Critically discuss the principles of drafting defined terms (Adams Ch 6). (10)",
 ten:[["Intro","Definitions save repetition and keep meaning consistent; failure to say the same thing the same way invites two constructions (Stark, Storage Space)."],["Functions","Expand/limit, clarify, resolve ambiguity, explain technical terms, express deal concepts, list."],["Verbs","<b>Means</b> complete; <b>includes</b> enlarges but 'creates mischief' (Mattel v MGA: were ideas 'inventions'?); combine 'W means X and includes Y but does not include Z'."],["Faults","Circular (Bonus Date/Bonus Period); overlapping (Licensor/Software/Licensor Software); stuffed (obligation inside); unused terms; defined after use; dictionary reliance. Adams tolerates mild repetition; Stark, Cohen, Payne do not."],["Forms","Autonomous (own entry, alphabetical) vs integrated (parenthetical, with 'the'; mid-sentence placement can change meaning, Dynaco 'Contracts')."],["Placement","Front (Stark, Haggard, Cohen) vs back plus on-site (Adams) vs index vs shared appendix."],["Strategy","Definitions set standards and favour a side (closed-list vs criteria 'Force Majeure Event'; who is an 'Affiliate')."],["Interpretation clauses","Stark's typical rules (including = without limitation, statutes as amended); must not enlarge the parties (ABC cl 3.1–3.2)."],["Conclusion","A definition is a tool; every defined term must earn its place."]]},
{u:"u2",t:"Operative clauses and payment",
 q5:"What should a payment clause contain? (5)",
 five:["Who pays whom, how much, currency, when, why, how (Stark: 'follow the cash').","Due date and trigger, one only (RetailCo problem).","Method: immediately available funds, where (Chicago vs Tokyo).","Tax (VAT/GST inclusive?), interest on late payment, set-off, withholding.","What happens to the money on early termination (Payne)."],
 q10:"Discuss how action sections and payment provisions should be drafted. (10)",
 ten:[["Intro","Stark: wrong payment drafting is 'not generally forgiven'. Action sections come first because they are 'where the action is'."],["Action sections","Subject-matter performance ('Subject to the provisions of this Agreement, the Company shall hire…'), payment, term, closing date and deliveries; self-executing grants use present tense."],["Stark's guidelines","Follow the cash; state amount; active voice; calculate before signing; due date; stub periods; method; separate provision per payment; test formulas."],["A&amp;W","Fixed vs variable price; formula in maths (Chartbrook); VAT; interest; time of essence; currency risk; deductions; refundable advances; ancillary costs."],["Implied conditions","'Net 30 from delivery': payment not due until delivery (Burnham); first performer is a creditor and needs security, guarantee or progress payments."],["Class cases","RetailCo (two triggers), Singapore buyer (define Business Day by place), Arclight cl 14 (fees exclusive of tax; invoice deemed accepted after 7 Business Days)."],["Indian practice","GST invoice, TDS, interest, MSMED 45-day limit (beyond readings); ICA s 46, s 55."],["Conclusion","One trigger, one place, every number checked."]]},
{u:"u2",t:"Confidentiality and exclusivity",
 q5:"What are the standard exclusions and remedies in a confidentiality clause? (5)",
 five:["Exclusions: public without breach; already known; independently developed; received from a non-bound third party; legally compelled (prompt notice).","Obligations: no disclosure <i>or use</i>; need-to-know recipients bound; security; return/destruction.","Term: disclosure period plus survival (2–5 years); trade secrets while secret.","Remedies: injunction (damages inadequate), damages, LDs, indemnity, termination.","Carve confidentiality out of the liability cap or super-cap it."],
 q10:"Discuss the drafting of a confidentiality clause, with reference to the Indian position. (10)",
 ten:[["Intro","Confidentiality protects information shared in the deal, standalone (NDA) or as a clause."],["Type","Mutual, one-way (discloser/recipient favourable), multilateral; identify direction of information flow (Singhania)."],["Definition","'Most critical part': broad catch-all vs marking requirement (30 days to confirm oral disclosure). Define cautiously and in detail."],["Exclusions and obligations","As in the five-mark list; recipient answers for its employees and advisers."],["Term and survival","Not indefinite (Singhania); state whether obligations survive termination."],["Remedies","Injunction, damages (hard to quantify), LDs (reasonable estimate; s 74), indemnity; carve-out from cap (Defects set 2 Q9)."],["Indian law","Golikari: protects trade secrets, not general skill; Shree Gopal Paper Mills (no secrets shown); leakage hard to prove (Sandhya Organic). DPDP Act for personal data."],["Exclusivity link","Exclusivity is a negative covenant paired with grantee duties (Burnham, Musselshell). Define Territory; reserve customers 'Subject to…'; lock-in; minimums (Bortolotti); in-term OK (Gujarat Bottling), post-term void (s 27)."]]},

{u:"u3",t:"Representations and warranties; breach and remedies",
 q5:"Distinguish a representation from a warranty and state the remedies. (5)",
 five:["Representation: statement of past/present fact made to induce reliance.","Warranty: promise that the statement is true; operates as an indemnity.","Misrepresentation is a tort: rescission; fraud adds damages.","Breach of warranty is contract: benefit-of-bargain damages, no reliance (CBS v Ziff-Davis).","Recipient takes both; maker narrows by knowledge, materiality and disclosure schedule."],
 q10:"Discuss the consequences of breach and how a contract can pre-agree remedies. (10)",
 ten:[["Intro","First ask whether non-performance is a breach or excused (force majeure, waiver, failed condition, trade usage)."],["Damages","Expectation measure ($20,000 profit). Indian ICA s 73: natural or contemplated loss, no remote loss."],["Counter-performance","Is it still due? Material breach; state it expressly. 'Time is of the essence' needs a consequence ('Buyer does not have to accept the goods')."],["Contract remedies (Stark)","Price adjustment (0.5% per week, cap 5%), self-help, default interest, injunction, LDs, indemnity, set-off, cumulative vs exclusive."],["Cure and default","Grace periods (30 days non-payment); Default → Event of Default; 'has occurred and is continuing'; notice should state grounds, money due, effect, survival."],["LDs vs penalty","Reasonable pre-estimate. UK: Cavendish v Makdessi ('legitimate interest'). India: s 74, reasonable compensation up to the sum (Kailash Nath; Saw Pipes)."],["Specific performance","Not for personal services; Specific Relief Act 2018 makes it the general rule."],["Conclusion","Spell out the if/thens (Payne)."]]},
{u:"u3",t:"Indemnity and limitation of liability",
 q5:"Explain the key elements of an indemnity clause. (5)",
 five:["Trigger: R&amp;W breach, IP infringement, confidentiality breach, negligence.","Scope: losses, damages, costs, legal fees; usually third-party claims.","Duty to <b>defend</b> as well as indemnify.","Procedure: prompt notice, cooperation, indemnifier controls defence, consent for settlements admitting fault.","IP indemnity: procure licence, modify, replace, or terminate and refund."],
 q10:"Discuss how limitation of liability and indemnity clauses interact and how to draft that interaction. (10)",
 ten:[["Intro","LoL caps and excludes; indemnity creates affirmative payment duties. Without drafting, one can swallow the other."],["Indemnity","Elements as above plus duration, cap, basket; scope narrow → broad; Indian ICA ss 124–125."],["LoL structure","Direct loss capped; indirect/consequential excluded. 'Consequential' is ambiguous (Biotronik, $100m lost resale profits were direct), so name the losses."],["Caps","Contract value; 12-month fees; multiple; fixed sum; insurance limits; super-cap."],["Carve-outs","IP indemnity, data/confidentiality, wilful misconduct/gross negligence, payment, death/personal injury, fraud."],["The collision","Webhosting: cl 23 excludes indirect loss; cl 32 indemnifies 'all Losses'. Fix: 'Except for liability under clause 32…' or a super-cap, and define 'Losses'."],["Indian law","Enforced between commercial parties; not for fraud; unconscionable terms (Brojo Nath)."],["EduTrack model","12-month cap, but IP indemnity, confidentiality and data breach, fraud outside it."]]},
{u:"u3",t:"Term, termination and post-termination",
 q5:"What should be covered when a contract ends? (5)",
 five:["Termination events: expiry, convenience, breach (with cure), insolvency, change of control, long-stop force majeure.","Notice: grounds, effective date, consequences.","Money: prepaid fees, accrued rights, refunds.","Return of property, data and confidential information.","Survival list and transition assistance."],
 q10:"Discuss the drafting of term, renewal and termination provisions. (10)",
 ten:[["Intro","Stark: endgame provisions govern how the deal ends; place them together near the end."],["Term","Unambiguous start and end; 'unless sooner terminated'; make fixed term 'subject to' early termination (A&amp;W); no implied right to end a fixed term (Jani-King)."],["Renewal","Auto-renewal vs option; length; notice deadline; never 'price to be agreed' (agreement to agree); Arclight cl 2 (3 years then 1-year, 90 days' notice)."],["Grounds","Material breach with cure, insolvency, change of control, force majeure long-stop (60 days), SLA failures (EduTrack: 3 in rolling 6 months)."],["Stark's three endings","Neutral, friendly (restore status quo, tie loose ends), unfriendly (notice, cure, remedy)."],["Six endgame points","Events; consequences of notice; termination date; survival of common-law rights; survival of specific clauses; dispute resolution."],["Post-termination","Survival with durations; refunds; accrued fees (Coraline); data return and deletion; exit assistance (Arclight cl 11, Meridian)."],["Indian hook","ICA ss 39, 64, 65, 75."]]},
{u:"u3",t:"Non-compete and non-solicitation (India)",
 q5:"State the Indian law on non-compete clauses. (5)",
 five:["ICA s 27: restraint of lawful trade is void; only exception is sale of goodwill within reasonable local limits.","During the term: valid unless unconscionable (Niranjan Shankar Golikari; Gujarat Bottling).","After the term: void; no reasonableness test (Krishan Murgai; Pepsi Foods; Percept D'Mark).","Trade secrets and connections are protectable, not general skill.","Draft confidentiality, IP, notice and narrow non-solicit instead."],
 q10:"Critically analyse restraint of trade clauses in employment and commercial contracts in India. (10)",
 ten:[["Intro","Three covenants: confidentiality, non-compete, non-solicit (Bhat)."],["Section 27","Void 'to that extent'; only goodwill exception. Stricter than English law."],["In-term","Valid: employees' fidelity, exclusive dealing (Gujarat Bottling)."],["Post-term","Void: Brahmaputra Tea (5 years, 40 miles); Jet Airways (7-year pilot); Pepsi Foods (12 months); Percept (post-term right to match)."],["Protectable interests","Trade secrets, business connections; Robb v Green; not skill."],["English comparison","Nordenfelt; Herbert Morris; Esso: void unless reasonable; B2B judged more leniently; blue-pencil vs reformation."],["Non-solicit","More readily upheld if narrow; non-dealing harder."],["Drafting","Legitimate interest in recitals; in-term restraint; precise activity, territory, period; severability; SRA s 42 injunction but not forcing service."]]},
{u:"u3",t:"Force majeure and hardship",
 q5:"What are the essentials of a force majeure clause? (5)",
 five:["Definition: event beyond reasonable control, not reasonably foreseeable, not avoidable.","List of events (and a general limb); tailor (strike, pandemic).","Notice and mitigation; relief 'to the extent of' the event.","Payment obligations and SLAs: say what happens.","Long-stop termination (Arclight 60 days). Indian hook: ICA ss 32, 56."],
 q10:"Distinguish force majeure from hardship and discuss how each should be drafted. (10)",
 ten:[["Intro","Force majeure excuses non-performance; hardship addresses performance that is possible but excessively onerous."],["Force majeure basis","Not an English concept (only frustration); CISG art 79 and UNIDROIT 7.1.7."],["Three conditions (Bortolotti)","Unforeseeable (ICC 9466), beyond control, irresistible (ICC 5195: practicability; iron by air)."],["Drafting","General test + list + consequences; avoid list-only US clauses; ICC 2003 clause; notice, mitigation, subcontractor test."],["Hardship","pacta sunt servanda default; trend to renegotiation (BGB §313, French art 1195); UNIDROIT 6.2: request renegotiation, tribunal may adapt/terminate; ICC Hardship Clause: negotiate then terminate."],["Drafting hardship","Trigger threshold, renegotiation timetable, fallback (expert/terminate), interim performance."],["India","s 32 (Energy Watchdog), s 56 (Satyabrata Ghose); cost increase alone not frustration; no general hardship doctrine, so draft it."]]},
{u:"u3",t:"Governing law, jurisdiction and dispute resolution",
 q5:"Distinguish governing law, jurisdiction and arbitration clauses. (5)",
 five:["Governing law: which rules apply (Bortolotti: keep it simple).","Jurisdiction: which court hears the dispute; need a separate forum clause (Burnham).","Arbitration: private tribunal; needs intent, institution/appointment, scope, seat.","They must not conflict (Cohen #19).","Cohen #20: silence → fight over lex loci contractus."],
 q10:"Discuss the drafting of dispute resolution clauses with reference to Cohen and Bortolotti. (10)",
 ten:[["Intro","Dispute resolution decides who decides, where and how."],["Governing law","'arising under and relating to… including torts' (Stark); avoid limiting words; mandatory rules survive (Ingmar)."],["Jurisdiction","Exclusive venue (Cohen #13); neutral forum; Indian parties cannot confer jurisdiction on a court that has none (ABC Laminart); s 28."],["Cohen's warnings","#17 vague mediation (name mediator, place, hours, cost); #18 deadlock arbitrator scheme; #22 'AAA rules' pasted."],["Bortolotti","Essentials and typical errors (pathological clause; split tribunals; narrow scope; courts + arbitration); optional seat, language, number of arbitrators."],["Multi-tier","Negotiation → mediation → arbitration; Arclight cl 6 model."],["India","A&amp;C Act 1996; BGS SGS Soma (venue as seat); Perkins Eastman (unilateral appointment invalid); s 12A Commercial Courts Act."]]},
{u:"u3",t:"Boilerplate",
 q5:"Explain why boilerplate matters, with three examples. (5)",
 five:["Stark: 'boilerplate' misleads; each clause raises real issues.","Entire agreement: excludes earlier deals; to cover misrepresentation add non-reliance; fraud cannot be excluded.","Assignment: cover change of control, merger, operation of law, delegation; 'written' consent.","Notices: method, address, deemed receipt (Mannai v Eagle Star).","Conform to this agreement's defined terms (Payne)."],
 q10:"Discuss the main boilerplate clauses and the drafting risks of copying a template. (10)",
 ten:[["Intro","Anatomy block C; Burnham warns not to gloss over it."],["Entire agreement","Cohen #15: 24 words; carve out NDAs/MoUs; no-reliance wording."],["Amendment and waiver","Signed writing; courts/CISG may allow conduct to override; draft specific non-waiver for key rights."],["Severability","Make survival depend on essential terms; replace with nearest valid clause; Bortolotti export-ban licence example."],["Assignment","Void vs breach; novation for burdens; Kopper Kettles (change of control not caught)."],["Notices","Writing, method, deemed receipt; Cohen #25 (sent or received?)."],["Others","Counterparts, third-party rights, further assurance, no set-off, publicity."],["Template risk","Cohen #22 cut-and-paste; keep identical across transaction documents (Stark)."]]}
];

const PLAN = [
 ["6:35–6:50","Warm-up: say the five lists on the Cram sheet out loud (Haggard, Burnham, Stark 7, Anatomy, Adams Ch 7)."],
 ["6:50–7:35","Unit 1: chunks 1.1 to 1.8. Read the points, then answer the flashcards for Unit 1."],
 ["7:35–7:45","Break. Water, walk, no phone."],
 ["7:45–8:30","Unit 2: chunks 2.1 to 2.10. Focus on 2.3 definitions and 2.6 to 2.9 (class cases)."],
 ["8:30–8:40","Break."],
 ["8:40–9:20","Unit 3: chunks 3.1 to 3.10. Make 3.2, 3.4, 3.5, 3.6, 3.7 your priorities."],
 ["9:20–9:50","Practice: pick 2 long questions and write bullet outlines from memory, then check the skeletons."],
 ["9:50–10:00","Cram sheet once, then sleep. Do not start new material."]
];

/* ---------- HELPERS ---------- */
const $ = s => document.querySelector(s);
const store = {
  get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
let doneMap = store.get("ccd-done",{});
let planMap = store.get("ccd-plan",{});

function renderUnit(key,title,intro){
  const el = $("#v-"+key);
  el.innerHTML = "<h2>"+title+"</h2><p class='note'>"+intro+"</p>" + CHUNKS[key].map(c=>{
    const d = !!doneMap[c.id];
    return "<article class='card"+(d?" done":"")+"' id='c"+c.id.replace('.','_')+"'>"+
      "<div class='chead'><div><span class='tag'>Chunk "+c.id+"</span><h3>"+c.t+"</h3></div>"+
      "<label><input type='checkbox' data-id='"+c.id+"'"+(d?" checked":"")+"> Done</label></div>"+
      "<ul>"+c.pts.map(p=>p.startsWith("<div")?"<li style='list-style:none;margin-left:-1.15rem'>"+p+"</li>":"<li>"+p+"</li>").join("")+"</ul>"+
      (EX[c.id]?"<div class='ex'><b>Examples to quote</b><ul>"+EX[c.id].map(x=>"<li>"+x+"</li>").join("")+"</ul></div>":"")+
      "<div class='hook'><b>Remember / Indian hook</b>"+c.hook+"</div></article>";
  }).join("");
}

function updateProgress(){
  const all = Object.values(CHUNKS).flat();
  const n = all.filter(c=>doneMap[c.id]).length;
  $("#pct").textContent = n+" / "+all.length+" chunks";
  $("#barfill").style.width = Math.round(100*n/all.length)+"%";
}

function renderPlan(){
  const el=$("#v-plan");
  el.innerHTML = "<h2>Tonight, 6:35 to 10:00</h2>"+
  "<p>You've already read to page 127. Tonight is about <span class='mark'>recall, not re-reading</span>. Read a chunk, close your eyes, say the main list, then flip the cards.</p>"+
  "<ul class='plan'>"+PLAN.map((p,i)=>"<li><span class='time'>"+p[0]+"</span><label style='display:flex;gap:.5rem;cursor:pointer'><input type='checkbox' data-plan='"+i+"'"+(planMap[i]?" checked":"")+"><span>"+p[1]+"</span></label></li>").join("")+"</ul>"+
  "<div class='card'><h3>ADHD-friendly rules for tonight</h3><ul><li>25 minutes on, 5 off. One chunk is about 5 minutes.</li><li>After every chunk, tick 'Done'. The bar at the top is your score.</li><li>If a chunk feels dense, only read the highlighted words and the 'Remember' box, then come back.</li><li>Flashcards beat re-reading: say the answer out loud before you flip.</li><li>Priority if you run short: Burnham, Stark 7, defects method, definitions (2.3), indemnity/LoL (3.3, 3.4), termination (3.5), restraint of trade (3.6), force majeure (3.7).</li></ul></div>"+
  "<div class='card'><h3>The exam in one picture</h3><p>Your instructor's rubric rewards five things, in this order: <b>understand the transaction → spot and rank risks → analyse clauses → redraft precisely → practical client advice.</b> Use that as the skeleton for every long answer. For short answers: define, give the rule or source, give one example.</p></div>";
}

/* flashcards */
let deck=[], idx=0, shown=false, filter="all", known=store.get("ccd-known",{});
function buildDeck(){
  deck = CARDS.map((c,i)=>({u:c[0],q:c[1],a:c[2],i})).filter(c=>filter==="all"||c.u===filter||(filter==="todo"&&!known[c.i]));
  if(filter==="todo") deck = CARDS.map((c,i)=>({u:c[0],q:c[1],a:c[2],i})).filter(c=>!known[c.i]);
  idx=0; shown=false;
}
function renderCards(){
  const el=$("#v-cards");
  const kcount=Object.keys(known).length;
  const f=[["all","All"],["u1","Unit 1"],["u2","Unit 2"],["u3","Unit 3"],["todo","Not yet known"]];
  el.innerHTML="<h2>Flashcards</h2><p class='note'>Say the answer out loud, then tap the card. Mark 'Got it' or 'Again'.</p>"+
  "<div class='btnrow'>"+f.map(x=>"<button class='btn"+(filter===x[0]?" sel":"")+"' data-f='"+x[0]+"'>"+x[1]+"</button>").join("")+"<button class='btn' id='shuf'>Shuffle</button></div>"+
  "<div id='cardbox'></div><p class='stat' id='cstat'></p>";
  drawCard();
}
function drawCard(){
  const box=$("#cardbox"); if(!box) return;
  if(!deck.length){box.innerHTML="<div class='card'>Nothing left in this set. Pick another filter.</div>";$("#cstat").textContent="";return}
  const c=deck[idx];
  box.innerHTML="<button class='fc' id='fc' type='button'><span class='tag'>"+({u1:"Unit 1",u2:"Unit 2",u3:"Unit 3"})[c.u]+" · card "+(idx+1)+" of "+deck.length+"</span><span class='q'>"+c.q+"</span><span class='a'>"+(shown?c.a:"")+"</span>"+(shown?"":"<span class='note' style='margin-top:.8rem'>Tap to reveal</span>")+"</button>"+
  "<div class='btnrow'><button class='btn' id='again'>Again</button><button class='btn pri' id='got'>Got it</button><button class='btn' id='skip'>Next</button></div>";
  $("#cstat").textContent="Known: "+Object.keys(known).length+" of "+CARDS.length;
}
function nextCard(){idx=(idx+1)%deck.length;shown=false;drawCard()}

/* practice */
function renderQs(){
  $("#v-qs").innerHTML="<h2>Practice questions</h2><p class='note'>Write your own bullet outline first (even 3 minutes), then open the skeleton.</p>"+
  QS.map((q,i)=>"<details><summary><span class='tag'>"+(q.k==="short"?"Short answer":"Long essay")+"</span>"+q.t+"</summary><p>"+q.a+"</p></details>").join("")+
  "<h2>Assignment problem patterns</h2><div class='table'><table><tr><th>Problem</th><th>Defect label</th><th>Fix in one line</th></tr>"+
  [["Alpha Foods: 'approval of the order'","Semantic ambiguity + vague trigger","Define Order Approval Date; calendar vs business days"],
   ["CloudServe: 'two hours during Business Hours'","Syntactic ambiguity","Split by severity; define Business Hours and 'respond'"],
   ["HealthPlus: 'adequate stock'","Vagueness","Weeks-of-sales benchmark; forecast duty"],
   ["BuildCo: 'reasonable extension'","Stacked vague standards; no mechanics","Delay Event list, notice, extension equals actual delay"],
   ["SteelCo: price 'by mutual agreement'","Agreement to agree (s 29)","Index + expert + exit"],
   ["FinLedger: 'renew on same terms'","Insufficient specificity","Length, price, notice, one renewal only"],
   ["RetailCo: 30 days vs 15 days","Inconsistency","One trigger; precedence clause"],
   ["PharmaCo: exclusive vs direct sales","Conflict + undefined term","Subject to / notwithstanding; define Institutional Customers"],
   ["FactoryCo: 'no further obligations'","Endgame silence (money)","Pro-rata refund rules; accrued rights survive"],
   ["Meridian: 'cease Services'","No exit / transition","Transition period, data return and deletion"],
   ["Coraline: cl 11.2 vs 7.3","Conflict, survival","'Except as provided in 7.3'; survival clause"],
   ["Kopper Kettles assignment","Unadapted template","Change of control, merger, delegation, void transfers"]
  ].map(r=>"<tr><td>"+r[0]+"</td><td>"+r[1]+"</td><td>"+r[2]+"</td></tr>").join("")+"</table></div>";
}

function renderCram(){
  $("#v-cram").innerHTML="<h2>Cram sheet</h2><p class='note'>Read this last, before bed and tomorrow morning.</p><div class='cheat'>"+
  CRAM.map(c=>"<div class='card'><h3>"+c.t+"</h3><ul>"+c.b.map(x=>"<li>"+x+"</li>").join("")+"</ul></div>").join("")+"</div>";
}

/* ---------- ROUTER ---------- */
const VIEWS=["plan","hour","u1","u2","u3","cards","qs","ans","quiz","cram"];
/* ---------- 1-HOUR READ ---------- */
let hrLeft=3600, hrTimer=null;
function fmt(s){const m=Math.floor(s/60),r=s%60;return String(m).padStart(2,"0")+":"+String(r).padStart(2,"0")}
function renderHour(){
  const U={u1:["Unit 1: reading and understanding",20],u2:["Unit 2: core clauses",12],u3:["Unit 3: risk, breach and exit",17]};
  const lists=c=>"<div class='card'><h3>"+c.t+"</h3><ul>"+c.b.map(x=>"<li>"+x+"</li>").join("")+"</ul></div>";
  $("#v-hour").innerHTML="<h2>1-hour read</h2><p class='note'>For just before you walk in. Read straight down. Every topic has the five points you must be able to write, plus the spine of a 10-mark answer. Examples and cases are inside the points.</p>"+
  "<div class='card'><div class='chead'><div><span class='tag'>Timer</span><h3 id='hrclock' style='font-family:var(--mono)'>"+fmt(hrLeft)+"</h3></div><div class='btnrow'><button class='btn pri' data-hr='go'>Start / pause</button><button class='btn' data-hr='reset'>Reset</button></div></div><p class='note'>Plan: 5 min lists · 20 min Unit 1 · 12 min Unit 2 · 17 min Unit 3 · 6 min final check.</p></div>"+
  "<h2>Minutes 0–5: lists and answer shape</h2>"+lists(CRAM[0])+lists(CRAM[4])+
  ["u1","u2","u3"].map(u=>"<h2>"+U[u][0]+" ("+U[u][1]+" min)</h2>"+ANS.filter(a=>a.u===u).map(a=>
    "<div class='card'><h3>"+a.t+"</h3><ul>"+a.five.map(x=>"<li>"+x+"</li>").join("")+"</ul><div class='hook'><b>10-mark spine</b>"+a.ten.map(x=>x[0]).join(" → ")+"</div></div>").join("")).join("")+
  "<h2>Final 6 minutes</h2>"+lists(CRAM[2])+lists(CRAM[3])+lists(CRAM[5]);
}
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-hr]");if(!t)return;
  if(t.dataset.hr==="go"){
    if(hrTimer){clearInterval(hrTimer);hrTimer=null}
    else hrTimer=setInterval(()=>{hrLeft=Math.max(0,hrLeft-1);const c=$("#hrclock");if(c)c.textContent=fmt(hrLeft);if(!hrLeft){clearInterval(hrTimer);hrTimer=null}},1000);
  } else {if(hrTimer){clearInterval(hrTimer);hrTimer=null}hrLeft=3600;const c=$("#hrclock");if(c)c.textContent=fmt(hrLeft)}
});
/* ---------- ANATOMY QUIZ ---------- */
const BLK={A:"A Introductory",B:"B Operative",C:"C Boilerplate",D:"D Signature / schedules"};
const SORT=[["Recitals","A","Context for the deal, so introductory."],["Interpretation","A","Reading rules sit with definitions, before the deal."],["Effective date","A","Listed in the introductory block of the chart."],["Payments","B","Core exchange of the deal."],["Indemnity","B","Risk allocation is operative."],["Territory","B","Scope of rights, so operative."],["Non-compete","B","A restrictive covenant, so operative."],["Survival of clauses","B","Part of the exit, which the chart puts in the operative block."],["Force majeure","B","On the chart it is the last operative clause (many precedents put it in boilerplate)."],["Further assurance","C","Standard administrative rule."],["Waiver","C","Boilerplate."],["Entire agreement","C","Boilerplate, usually the last clause."],["Governing law and jurisdiction","C","Boilerplate on the chart."],["Name of signatory","D","Execution block."],["Annexures","D","Detail attached at the end."]];
const ORD=[
{t:"Block A: introductory clauses",tip:"The reader first learns what the document is, who is in it, why, and how to read it.",items:["Title of agreement","Preamble","Date of execution","Description of parties","Recitals","Effective date","Definition of terms used","Interpretation"]},
{t:"Block B: operative clauses (the life of the deal)",tip:"Follow the chart: duties and conditions, then money, then protections and risk, then term and exit.",items:["Rights and obligations of the parties","Conditions precedent","Payments","Confidentiality","Indemnity","Limitation of liability","Representations and warranties","Term","Termination","Survival of clauses"]},
{t:"Block C: boilerplate clauses",tip:"Chart order, ending with entire agreement.",items:["Further assurance","No set-off or counterclaim","Non-reliance","Notice","Publicity","Severability","Governing law and jurisdiction","Dispute resolution mechanism","Waiver","Assignment","Amendments","Entire agreement"]},
{t:"Whole contract: one clause per stage",tip:"A then B then C then D. Schedules come after the signature block on the chart.",items:["Title of agreement","Description of parties","Recitals","Definition of terms used","Payments","Confidentiality","Termination","Force majeure","Dispute resolution mechanism","Entire agreement","Name of signatory","Annexures"]},
{t:"Arclight–Nexora mini (from the class assignment)",tip:"Matches the answer key for the 25-clause exercise, shortened.",items:["Title and date of execution (Clause 12)","Description of parties (Clause 8)","Recitals (Clause 13)","Definitions (Clause 5)","Rights and obligations (Clause 9)","Payments (Clause 14)","Confidentiality (Clause 19)","Term and renewal (Clause 2)","Termination (Clause 18)","Force majeure (Clause 1)","Dispute resolution (Clause 6)","Entire agreement (Clause 7)","Signature block (Clause 3)"]}
];
let qmode="sort", qOrder=[], qChecked=false, qAns={}, qSortChecked=false;
function shuffle(a){const b=a.slice();do{for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}}while(a.length>1&&b.every((x,i)=>x===a[i]));return b}
let sortDeck=[];
function newSort(){sortDeck=shuffle(SORT).slice(0,10);qAns={};qSortChecked=false}
function newOrd(i){qOrder=shuffle(ORD[i].items);qChecked=false}
function renderQuiz(){
  const el=$("#v-quiz");
  const modes=[["sort","1 Sort into blocks"]].concat(ORD.map((o,i)=>[String(i),(i+2)+" "+["Block A","Block B","Block C","Whole contract","Arclight mini"][i]]));
  let h="<h2>Anatomy quiz</h2><p class='note'>Based on the class Anatomy of a Contract chart. Try from memory, then check.</p><div class='btnrow'>"+modes.map(m=>"<button class='btn"+(qmode===m[0]?" sel":"")+"' data-qa='mode' data-v='"+m[0]+"'>"+m[1]+"</button>").join("")+"</div>";
  if(qmode==="sort"){
    h+="<p>Tap A, B, C or D for each clause.</p>"+sortDeck.map((s,i)=>{
      const a=qAns[i];let st="";
      if(qSortChecked){st=a===s[1]?"<span style='color:var(--good)'>Correct. </span>":"<span style='color:var(--bad)'>Answer: "+BLK[s[1]]+". </span>";st+="<span class='note'>"+s[2]+"</span>"}
      return "<div class='card'><b>"+s[0]+"</b><div class='btnrow'>"+["A","B","C","D"].map(k=>"<button class='btn"+(a===k?" sel":"")+"' data-qa='pick' data-i='"+i+"' data-v='"+k+"'>"+k+"</button>").join("")+"</div>"+st+"</div>"}).join("")+
      "<div class='btnrow'><button class='btn pri' data-qa='checksort'>Check</button><button class='btn' data-qa='newsort'>New set</button></div>";
    if(qSortChecked){const n=sortDeck.filter((s,i)=>qAns[i]===s[1]).length;h+="<p class='stat'>Score: "+n+" / "+sortDeck.length+"</p>"}
  } else {
    const r=ORD[+qmode];
    h+="<h3>"+r.t+"</h3><p class='note'>"+r.tip+" Use the arrows to move a clause.</p><div>"+qOrder.map((x,i)=>{
      let st="";if(qChecked){const ok=r.items[i]===x;st=ok?"var(--good)":"var(--bad)"}
      return "<div class='card' style='display:flex;gap:.6rem;align-items:center;padding:.5rem .8rem;"+(qChecked?"border-color:"+st:"")+"'><span class='stat' style='width:1.6rem'>"+(i+1)+"</span><span style='flex:1;min-width:0'>"+x+"</span><button class='btn' data-qa='up' data-i='"+i+"' aria-label='Move up'>↑</button><button class='btn' data-qa='down' data-i='"+i+"' aria-label='Move down'>↓</button></div>"}).join("")+"</div>"+
      "<div class='btnrow'><button class='btn pri' data-qa='checkord'>Check</button><button class='btn' data-qa='showord'>Show answer</button><button class='btn' data-qa='neword'>Reshuffle</button></div>";
    if(qChecked){const n=qOrder.filter((x,i)=>r.items[i]===x).length;h+="<p class='stat'>In the right place: "+n+" / "+r.items.length+"</p>"}
  }
  el.innerHTML=h;
}
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-qa]");if(!t)return;
  const a=t.dataset.qa,i=+t.dataset.i;
  if(a==="mode"){qmode=t.dataset.v;if(qmode==="sort")newSort();else newOrd(+qmode)}
  else if(a==="pick"){qAns[i]=t.dataset.v}
  else if(a==="checksort"){qSortChecked=true}
  else if(a==="newsort"){newSort()}
  else if(a==="up"&&i>0){[qOrder[i-1],qOrder[i]]=[qOrder[i],qOrder[i-1]];qChecked=false}
  else if(a==="down"&&i<qOrder.length-1){[qOrder[i+1],qOrder[i]]=[qOrder[i],qOrder[i+1]];qChecked=false}
  else if(a==="checkord"){qChecked=true}
  else if(a==="showord"){qOrder=ORD[+qmode].items.slice();qChecked=true}
  else if(a==="neword"){newOrd(+qmode)}
  const y=window.scrollY;renderQuiz();window.scrollTo(0,y);
});
function renderAns(){
  const names={u1:"Unit 1",u2:"Unit 2",u3:"Unit 3"};
  $("#v-ans").innerHTML="<h2>Answer bank</h2><p class='note'>For tomorrow morning. Each topic has a sample 5-mark and 10-mark question with an answer you can adapt. A 5-marker needs about five separate points. A 10-marker needs an intro, five or six developed points with one example or case, and a one-line conclusion. Write the outline from memory first, then open the answer.</p>"+
  ["u1","u2","u3"].map(u=>"<h2>"+names[u]+"</h2>"+ANS.filter(a=>a.u===u).map(a=>
    "<details><summary><span class='tag'>"+names[u]+"</span>"+a.t+"</summary>"+
    "<div class='ansblock'><h3>5-mark: "+a.q5+"</h3><ul>"+a.five.map(x=>"<li>"+x+"</li>").join("")+"</ul></div>"+
    "<div class='ansblock'><h3>10-mark: "+a.q10+"</h3><ol>"+a.ten.map(x=>"<li><b>"+x[0]+".</b> "+x[1]+"</li>").join("")+"</ol></div></details>").join("")).join("");
}
function route(){
  const h=(location.hash||"#plan").slice(1);
  const v=VIEWS.includes(h)?h:"plan";
  VIEWS.forEach(x=>{$("#v-"+x).classList.toggle("on",x===v)});
  document.querySelectorAll("#tabs a").forEach(a=>a.setAttribute("aria-current",a.getAttribute("href")==="#"+v?"true":"false"));
  window.scrollTo(0,0);
}
window.addEventListener("hashchange",route);

/* ---------- EVENTS ---------- */
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset.id){
    if(t.checked)doneMap[t.dataset.id]=1;else delete doneMap[t.dataset.id];
    store.set("ccd-done",doneMap);
    t.closest(".card").classList.toggle("done",t.checked);
    updateProgress();
  }
  if(t.dataset.plan!==undefined){
    if(t.checked)planMap[t.dataset.plan]=1;else delete planMap[t.dataset.plan];
    store.set("ccd-plan",planMap);
  }
});
document.addEventListener("click",e=>{
  const t=e.target.closest("button"); if(!t) return;
  if(t.id==="fc"){shown=!shown;drawCard()}
  else if(t.id==="got"){known[deck[idx].i]=1;store.set("ccd-known",known);nextCard()}
  else if(t.id==="again"){delete known[deck[idx].i];store.set("ccd-known",known);nextCard()}
  else if(t.id==="skip"){nextCard()}
  else if(t.id==="shuf"){deck.sort(()=>Math.random()-.5);idx=0;shown=false;drawCard()}
  else if(t.dataset.f){filter=t.dataset.f;buildDeck();renderCards()}
  else if(t.id==="themeBtn"){
    const r=document.documentElement;
    const cur=r.getAttribute("data-theme");
    const dark=cur?cur==="dark":matchMedia("(prefers-color-scheme:dark)").matches;
    r.setAttribute("data-theme",dark?"light":"dark");
  }
});

/* ---------- INIT ---------- */
renderPlan();
renderUnit("u1","Unit 1: Reading and understanding contracts","Eight chunks. Tick each when you can explain it without looking.");
renderUnit("u2","Unit 2: Core clauses and operative provisions","Ten chunks. Definitions (2.3) is the most testable.");
renderUnit("u3","Unit 3: Risk, breach and exit","Ten chunks. Pair each with its Indian-law hook.");
buildDeck();renderCards();renderQs();renderAns();newSort();renderQuiz();renderCram();renderHour();updateProgress();route();
</script>
